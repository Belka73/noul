<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOUL : Luminous Space</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: #000000; user-select: none; cursor: none;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard Variable", Pretendard, sans-serif;
    }
    #webcam-video {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; transform: scaleX(-1);
      z-index: 0; pointer-events: none;
      opacity: 0.28;
    }
    #video-dark-overlay {
      position: absolute; inset: 0;
      background: #000000;
      opacity: 0.65;
      z-index: 1; pointer-events: none;
    }
    #three-canvas-container {
      position: absolute; inset: 0; z-index: 10;
    }

    /* 🌟 기 모으는 원과 동일한 크기(36px) 및 반투명 2중 화이트 디자인으로 통일 */
    #hand-pointer {
      position: absolute; 
      width: 36px; height: 36px;
      margin-left: -18px; margin-top: -18px; 
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.15);
      pointer-events: none; z-index: 30; opacity: 0; 
      transition: opacity 0.25s ease, transform 0.1s ease;
      will-change: transform, opacity;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 기 모으기 위젯의 내부 코어 원과 동일한 중심 코어 */
    #hand-pointer::after {
      content: '';
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
    }

    /* 🌟 1단계: 외곽이 부드럽게 번지는 타원형 검은색 안개 블러 말풍선 (고민/이유) */
    #floating-concern-card {
      position: absolute;
      transform: translate(45px, -115%);
      width: 320px;
      min-height: 180px;
      padding: 40px 38px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
      z-index: 42;
      opacity: 0;
      transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, opacity;
    }

    #floating-concern-card::before {
      content: '';
      position: absolute;
      inset: -20px;
      background: radial-gradient(ellipse 65% 55% at center, rgba(8, 8, 10, 0.96) 0%, rgba(8, 8, 10, 0.88) 35%, rgba(8, 8, 10, 0.55) 60%, rgba(8, 8, 10, 0.15) 80%, rgba(0, 0, 0, 0) 100%);
      filter: blur(16px);
      z-index: -1;
      border-radius: 50%;
    }

    #floating-concern-card.visible {
      opacity: 1;
      transform: translate(45px, -125%);
    }

    /* 선택된 키워드: 즉시 유지 + 순백색 발광 네온 효과 */
    .concern-badge-tag {
      display: inline-block;
      color: #ffffff;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.3px;
      margin-bottom: 8px;
      z-index: 2;
      text-shadow: 0 0 10px rgba(255, 255, 255, 1.0),
                   0 0 20px rgba(255, 255, 255, 0.85),
                   0 0 35px rgba(255, 255, 255, 0.65),
                   0 0 50px rgba(255, 255, 255, 0.4);
    }

    /* 자세한 고민 이유 */
    #floating-concern-reason {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.55;
      color: #f0f0f5;
      word-break: keep-all;
      z-index: 2;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      min-height: 38px;
    }

    /* 🌟 2단계: 외곽이 완벽히 번져있는 타원형 흰색 빛 블러 말풍선 (다정한 한마디) */
    #floating-info-card {
      position: absolute;
      transform: translate(45px, -115%);
      width: 320px;
      min-height: 180px;
      padding: 40px 38px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
      z-index: 40;
      opacity: 0;
      transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, opacity;
    }
    #floating-info-card::before {
      content: '';
      position: absolute;
      inset: -20px;
      background: radial-gradient(ellipse 65% 55% at center, rgba(255, 255, 255, 0.98) 0%, rgba(255, 255, 255, 0.9) 28%, rgba(255, 255, 255, 0.55) 55%, rgba(255, 255, 255, 0.15) 75%, rgba(255, 255, 255, 0) 100%);
      filter: blur(14px);
      z-index: -1;
      border-radius: 50%;
    }
    #floating-info-card.visible {
      opacity: 1;
      transform: translate(45px, -125%);
    }

    #floating-butterfly-name {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #08080a;
      margin-bottom: 5px;
      z-index: 2;
    }

    #floating-butterfly-memo {
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.45;
      color: #1a1a20;
      word-break: keep-all;
      z-index: 2;
      min-height: 36px;
    }

    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      vertical-align: middle;
      background-color: currentColor;
      margin-left: 2px;
      animation: cursorBlink 0.75s infinite;
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* 🌟 하단 가로 배너형 제스처 안내 바 */
    #gesture-guide-banner {
      position: absolute;
      bottom: 2.2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.8rem;
      padding: 0.85rem 2.2rem;
      background: rgba(18, 18, 22, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 9999px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      white-space: nowrap;
      will-change: transform;
    }

    .guide-banner-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 13.5px;
      color: #e5e5ea;
      letter-spacing: -0.2px;
    }
    .guide-banner-item strong {
      color: #ffffff;
      font-weight: 700;
    }
    .guide-banner-divider {
      width: 1px;
      height: 14px;
      background: rgba(255, 255, 255, 0.22);
    }
  </style>
</head>
<body>

  <video id="webcam-video" playsinline autoplay muted></video>
  <div id="video-dark-overlay"></div>
  <div id="three-canvas-container"></div>
  <div id="hand-pointer"></div>

  <!-- 1단계: 고민 안내 카드 -->
  <div id="floating-concern-card">
    <div id="floating-concern-tag" class="concern-badge-tag">#완벽주의 강박</div>
    <div id="floating-concern-reason"></div>
  </div>

  <!-- 2단계: 다정한 한마디 카드 -->
  <div id="floating-info-card">
    <div id="floating-butterfly-name">‘나비’</div>
    <div id="floating-butterfly-memo"></div>
  </div>

  <!-- 하단 가로 나열 배너 -->
  <aside id="gesture-guide-banner">
    <div class="guide-banner-item">
      <span>👉</span>
      <span><strong>손가락 하나</strong> 나비가 손끝에 내려앉아요. 나비와 함께 교감해 보세요.</span>
    </div>
    <div class="guide-banner-divider"></div>
    <div class="guide-banner-item">
      <span>✊</span>
      <span><strong>주먹을 쥐면</strong> 나비들이 곁으로 모여들어요.</span>
    </div>
    <div class="guide-banner-divider"></div>
    <div class="guide-banner-item">
      <span>🖐️</span>
      <span><strong>손을 펼치면</strong> 나비들이 흩어져 날아가요.</span>
    </div>
  </aside>

  <script>
    /* ========================================================
       1. Three.js 설정 및 최적화 지오메트리 구축
       ======================================================== */
    function createStableWingGeom(isRight) {
      const shape = new THREE.Shape();
      const s = isRight ? 1 : -1;
      shape.moveTo(0, 0.5);
      shape.bezierCurveTo(s * 0.4, 1.0, s * 1.5, 2.0, s * 2.4, 1.8);
      shape.bezierCurveTo(s * 3.0, 1.6, s * 2.8, 0.8, s * 2.2, 0.2);
      shape.bezierCurveTo(s * 2.5, -0.4, s * 2.2, -1.5, s * 1.6, -1.8);
      shape.bezierCurveTo(s * 1.0, -2.0, s * 0.4, -1.6, s * 0.2, -1.0);
      shape.bezierCurveTo(s * 0.1, -0.6, s * 0.05, -0.2, 0, -0.5);
      shape.lineTo(0, 0.5);

      const geom = new THREE.ShapeGeometry(shape, 12);
      geom.computeVertexNormals();
      geom.computeBoundingBox();
      const bb = geom.boundingBox;
      const sizeX = bb.max.x - bb.min.x || 1;
      const sizeY = bb.max.y - bb.min.y || 1;
      const pos = geom.attributes.position;
      const uvs = [];

      for (let i = 0; i < pos.count; i++) {
        uvs.push((pos.getX(i) - bb.min.x) / sizeX, (pos.getY(i) - bb.min.y) / sizeY);
      }
      geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      return geom;
    }

    function createBodyGeom() {
      const points = [
        new THREE.Vector2(0.001, 0.8), new THREE.Vector2(0.14, 0.7),
        new THREE.Vector2(0.10, 0.5), new THREE.Vector2(0.18, 0.3),
        new THREE.Vector2(0.12, 0.0), new THREE.Vector2(0.15, -0.2),
        new THREE.Vector2(0.12, -0.4), new THREE.Vector2(0.08, -0.7),
        new THREE.Vector2(0.001, -0.9)
      ];
      return new THREE.LatheGeometry(points, 8);
    }

    function createAntenna(isRight, mat) {
      const group = new THREE.Group();
      const s = isRight ? 1 : -1;
      const curve = new THREE.CubicBezierCurve3(
        new THREE.Vector3(0, 0, 0), new THREE.Vector3(s * 0.2, 0.5, 0.1),
        new THREE.Vector3(s * 0.5, 0.9, 0.2), new THREE.Vector3(s * 0.65, 1.2, 0.3)
      );
      group.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 8, 0.035, 4, false), mat));
      const tip = new THREE.Mesh(new THREE.SphereGeometry(0.09, 6, 6), mat);
      tip.position.set(s * 0.65, 1.2, 0.3);
      group.add(tip);
      return group;
    }

    const container = document.getElementById('three-canvas-container');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 14.5);

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.25));
    container.appendChild(renderer.domElement);

    const textureLoader = new THREE.TextureLoader();
    const gltfLoader = new THREE.GLTFLoader();
    const leftGeom = createStableWingGeom(false);
    const rightGeom = createStableWingGeom(true);
    const bodyGeom = createBodyGeom();

    /* ========================================================
       🌟 궤적 파티클
       ======================================================== */
    const MAX_TRAIL_PARTICLES = 80;
    const trailPositions = new Float32Array(MAX_TRAIL_PARTICLES * 3);
    const trailData = [];

    for (let i = 0; i < MAX_TRAIL_PARTICLES; i++) {
      trailData.push({ x: 9999, y: 9999, z: 9999, vx: 0, vy: 0, life: 0 });
      trailPositions[i * 3 + 0] = 9999;
      trailPositions[i * 3 + 1] = 9999;
      trailPositions[i * 3 + 2] = 9999;
    }

    const trailGeom = new THREE.BufferGeometry();
    trailGeom.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));

    const pCanvas = document.createElement('canvas');
    pCanvas.width = 32; pCanvas.height = 32;
    const pCtx = pCanvas.getContext('2d');
    const pGrad = pCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
    pGrad.addColorStop(0, 'rgba(255, 255, 255, 1.0)');
    pGrad.addColorStop(0.4, 'rgba(230, 245, 255, 0.8)');
    pGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
    pCtx.fillStyle = pGrad;
    pCtx.fillRect(0, 0, 32, 32);
    const particleTex = new THREE.CanvasTexture(pCanvas);

    const trailMat = new THREE.PointsMaterial({
      map: particleTex, size: 0.5, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, color: 0xffffff
    });
    const trailPoints = new THREE.Points(trailGeom, trailMat);
    scene.add(trailPoints);

    let trailSpawnCursor = 0;
    function spawnButterflyTrail(pos) {
      const p = trailData[trailSpawnCursor];
      p.x = pos.x; p.y = pos.y; p.z = pos.z;
      p.vx = (Math.random() - 0.5) * 0.02;
      p.vy = (Math.random() - 0.5) * 0.02;
      p.life = 0.8;
      trailSpawnCursor = (trailSpawnCursor + 1) % MAX_TRAIL_PARTICLES;
    }

    function updateTrailParticles(dt) {
      let needsUpdate = false;
      const posAttr = trailGeom.attributes.position;
      for (let i = 0; i < MAX_TRAIL_PARTICLES; i++) {
        const p = trailData[i];
        if (p.life > 0) {
          p.life -= dt;
          p.x += p.vx; p.y += p.vy;
          posAttr.setXYZ(i, p.x, p.y, p.z);
          needsUpdate = true;
        } else if (p.x !== 9999) {
          p.x = 9999;
          posAttr.setXYZ(i, 9999, 9999, 9999);
          needsUpdate = true;
        }
      }
      if (needsUpdate) posAttr.needsUpdate = true;
    }

    const defaultFlock = [];
    const userFlock = [];
    const MAX_USER_BUTTERFLIES = 15;
    const rawUserDataList = [];

    function buildButterfly(data = {}, isUser = false, isDelayedArrival = false, isFingerTarget = false, customZ = 0) {
      const group = new THREE.Group();
      const innerGroup = new THREE.Group(); 
      
      let wingMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: false, alphaTest: 0.5 });
      if (isUser && data.texture_url && data.texture_url.startsWith('data:image')) {
        const userTex = textureLoader.load(data.texture_url);
        userTex.flipY = false;
        wingMat = new THREE.MeshBasicMaterial({ map: userTex, side: THREE.DoubleSide, transparent: false, alphaTest: 0.5 });
      }

      const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      let leftWing = new THREE.Mesh(leftGeom, wingMat);
      let rightWing = new THREE.Mesh(rightGeom, wingMat);
      const defaultBody = new THREE.Mesh(bodyGeom, whiteMat);
      
      innerGroup.add(leftWing);
      innerGroup.add(rightWing);
      innerGroup.add(defaultBody);
      
      const aL = createAntenna(false, whiteMat); aL.position.set(-0.05, 0.7, 0.15); innerGroup.add(aL);
      const aR = createAntenna(true, whiteMat); aR.position.set(0.05, 0.7, 0.15); innerGroup.add(aR);

      innerGroup.rotation.x = Math.PI / 2;
      group.add(innerGroup);

      const shapeId = data.wing_shape || 'crescent';
      const antId = data.antenna_type || 'ball';
      const targetAntennaPrefix = 'Antenna_' + antId;
      const modelPath = '3DButterfly/' + shapeId + '.glb';

      if (isUser && gltfLoader) {
        gltfLoader.load(modelPath, function(gltf) {
          const model = gltf.scene;
          let newWingL = null, newWingR = null;
          model.traverse(function(child) {
            if (child.isMesh) {
              const name = child.name;
              if (name.startsWith('Wing_L')) { newWingL = child; child.material = wingMat; }
              else if (name.startsWith('Wing_R')) { newWingR = child; child.material = wingMat; }
              else if (name.startsWith('Body')) { child.material = whiteMat; }
              else if (name.startsWith('Antenna_')) { child.material = whiteMat; child.visible = name.startsWith(targetAntennaPrefix); }
            }
          });

          if (newWingL && newWingR) {
            innerGroup.remove(leftWing);
            innerGroup.remove(rightWing);
            innerGroup.remove(defaultBody);
            innerGroup.remove(aL);
            innerGroup.remove(aR);
            model.scale.set(0.95, 0.95, 0.95);
            innerGroup.add(model);
            butterflyRecord.leftWing = newWingL;
            butterflyRecord.rightWing = newWingR;
          }
        }, undefined, function() {});
      }

      let initialVelocity;
      let targetScale = 0.22 + Math.random() * 0.08;

      if (isFingerTarget) {
        group.position.set(-18, 14, customZ);
        initialVelocity = new THREE.Vector3(0, 0, 0);
        targetScale = 0.52;
        group.scale.set(0.52, 0.52, 0.52);
      } else if (isDelayedArrival) {
        group.position.set((Math.random() - 0.5) * 5, -8.0, 1.0);
        initialVelocity = new THREE.Vector3((Math.random() - 0.5) * 0.03, 0.09, -0.02);
        group.scale.set(0.01, 0.01, 0.01);
      } else {
        group.position.set(
          (Math.random() - 0.5) * 26, 
          (Math.random() - 0.5) * 16, 
          -4.0 - Math.random() * 12.0
        );
        initialVelocity = new THREE.Vector3((Math.random() - 0.5) * 0.07, (Math.random() - 0.5) * 0.07, (Math.random() - 0.5) * 0.04);
        group.scale.set(targetScale, targetScale, targetScale);
      }

      scene.add(group);

      const butterflyRecord = {
        id: Math.random().toString(36).substring(7),
        group, innerGroup, leftWing, rightWing,
        velocity: initialVelocity,
        speed: 24.0 + Math.random() * 6.0, 
        seed: Math.random() * 1000,
        flapAmp: 1.0, 
        state: 'flying',
        targetScale: targetScale,
        isAscendingArrival: isDelayedArrival,
        arrivalTimer: 0,
        isSpecialLanding: isFingerTarget,
        specialState: isFingerTarget ? 'approaching' : null,
        name: data.name || (isUser ? "익명의 나비" : "나비"),
        memo: data.memo || "너의 찬란한 날갯짓을 응원해.",
        core_concern: data.core_concern || (Array.isArray(data.q2) && data.q2.length > 0 ? data.q2[0] : "완벽주의 강박"),
        concern_reason: data.concern_reason || "항상 잘 해내야 한다는 마음이 앞서서요."
      };

      return butterflyRecord;
    }

    for (let i = 0; i < 15; i++) {
      defaultFlock.push(buildButterfly({}, false, false, false));
    }

    const clock = new THREE.Clock();
    const dummyObj = new THREE.Object3D(); 
    
    const _vDir = new THREE.Vector3();
    const _vTargetPos = new THREE.Vector3();
    const _vOrbit = new THREE.Vector3();
    const _vLeave = new THREE.Vector3(25, 25, 0);

    let handTarget3D = new THREE.Vector3(999, 999, 0);
    let targetHandPos3D = new THREE.Vector3(999, 999, 0);
    let prevHandTarget3D = new THREE.Vector3(999, 999, 0);
    let isHandDetected = false;
    let interactionMode = 'none';
    
    let specialButterfly = null;
    let fistButterflies = []; 
    let fingerAngle = 1.0; 
    let handPerspectiveScale = 1.0;

    const floatingConcernCard = document.getElementById('floating-concern-card');
    const floatingConcernTag = document.getElementById('floating-concern-tag');
    const floatingConcernReason = document.getElementById('floating-concern-reason');

    const floatingInfoCard = document.getElementById('floating-info-card');
    const floatingName = document.getElementById('floating-butterfly-name');
    const floatingMemo = document.getElementById('floating-butterfly-memo');

    let landingStorySequenceTimer = null;
    let activeTypingTimeout = null;

    function typeWriterText(targetElement, fullText, speed = 45, callback = null) {
      if (activeTypingTimeout) clearTimeout(activeTypingTimeout);
      targetElement.innerHTML = '';
      let index = 0;
      function step() {
        if (index <= fullText.length) {
          const currentSub = fullText.substring(0, index);
          const isDone = index === fullText.length;
          targetElement.innerHTML = `${currentSub}${isDone ? '' : '<span class="typing-cursor"></span>'}`;
          index++;
          if (!isDone) {
            activeTypingTimeout = setTimeout(step, speed);
          } else if (callback) {
            callback();
          }
        }
      }
      step();
    }

    function resetLandingCards() {
      clearTimeout(landingStorySequenceTimer);
      if (activeTypingTimeout) clearTimeout(activeTypingTimeout);
      if (floatingConcernCard) floatingConcernCard.classList.remove('visible');
      if (floatingInfoCard) floatingInfoCard.classList.remove('visible');
      if (floatingConcernReason) floatingConcernReason.innerHTML = '';
      if (floatingMemo) floatingMemo.innerHTML = '';
    }

    function triggerLandingStorySequence(b) {
      resetLandingCards();
      if (floatingConcernCard) {
        floatingConcernTag.innerText = `#${b.core_concern}`;
        floatingConcernCard.classList.add('visible');
        const fullReason = `"${b.concern_reason}"`;
        setTimeout(() => { typeWriterText(floatingConcernReason, fullReason, 45); }, 150);
      }

      landingStorySequenceTimer = setTimeout(() => {
        if (floatingConcernCard) floatingConcernCard.classList.remove('visible');
        if (floatingInfoCard) {
          floatingName.innerText = `‘${b.name}’`;
          floatingInfoCard.classList.add('visible');
          const fullMemo = `"${b.memo}"`;
          setTimeout(() => { typeWriterText(floatingMemo, fullMemo, 45); }, 150);
        }
      }, 4200);
    }

    let currentScreenX = 0, currentScreenY = 0;
    let targetScreenX = 0, targetScreenY = 0;
    const handPointer = document.getElementById('hand-pointer');

    function updateMotion(b, time) {
      let currentTargetScale = b.targetScale;
      
      if (b.isSpecialLanding && (b.specialState === 'approaching' || b.specialState === 'landed')) {
        const landingBaseScale = 0.52;
        const effectivePerspective = Math.max(0.85, handPerspectiveScale);
        currentTargetScale = landingBaseScale * effectivePerspective;
      }

      if (b.isAscendingArrival) {
        b.arrivalTimer += 0.016;
        b.group.scale.set(
          b.group.scale.x + (b.targetScale - b.group.scale.x) * 0.04,
          b.group.scale.y + (b.targetScale - b.group.scale.y) * 0.04,
          b.group.scale.z + (b.targetScale - b.group.scale.z) * 0.04
        );
        b.velocity.y *= 0.99;
        if (b.arrivalTimer > 5.5 || b.group.position.y > 0) b.isAscendingArrival = false; 
      } else {
        b.group.scale.set(
          b.group.scale.x + (currentTargetScale - b.group.scale.x) * 0.1,
          b.group.scale.y + (currentTargetScale - b.group.scale.y) * 0.1,
          b.group.scale.z + (currentTargetScale - b.group.scale.z) * 0.1
        );
      }

      if (b.state === 'landing_rest') {
          b.flapAmp *= 0.92; 
          const flap = Math.sin(time * (b.speed * 0.8) + b.seed) * 0.16 * b.flapAmp;
          const restFold = -1.25; 
          b.leftWing.rotation.y = flap + restFold * (1 - b.flapAmp);
          b.rightWing.rotation.y = -flap - restFold * (1 - b.flapAmp);
      } else {
          b.flapAmp += (1.0 - b.flapAmp) * 0.1; 
          let currentFlapSpeed = b.speed;
          if (b.isSpecialLanding && b.specialState === 'approaching') {
            currentFlapSpeed = b.speed * 1.35;
          } else if (b.isAscendingArrival) {
            currentFlapSpeed = b.speed * 1.25;
          }
          const flap = Math.sin(time * currentFlapSpeed + b.seed) * 0.72 * b.flapAmp;
          b.leftWing.rotation.y = flap;
          b.rightWing.rotation.y = -flap;
      }

      let isFollowing = false;

      // 🌟 손가락 착석 전용 나비 이동
      if (b.isSpecialLanding) {
          isFollowing = true;

          if (b.specialState === 'approaching') {
              spawnButterflyTrail(b.group.position);

              const dx = b.group.position.x - handTarget3D.x;
              const dy = b.group.position.y - handTarget3D.y;
              const dist2D = Math.hypot(dx, dy);

              if (dist2D < 1.8) {
                  b.group.position.z = handTarget3D.z;
                  b.specialState = 'landed';
                  triggerLandingStorySequence(b);
              } else {
                  b.state = 'flying';
                  _vDir.subVectors(handTarget3D, b.group.position);
                  _vDir.z = 0; 
                  _vDir.normalize().multiplyScalar(0.26);
                  b.velocity.lerp(_vDir, 0.08); 
                  b.velocity.z = 0; 
                  
                  _vTargetPos.copy(b.group.position).add(b.velocity);
                  dummyObj.position.copy(b.group.position);
                  dummyObj.lookAt(_vTargetPos);
                  const rollAngle = (b.velocity.x * -15);
                  dummyObj.rotateZ(rollAngle); 
                  b.group.quaternion.slerp(dummyObj.quaternion, 0.18);
              }
          }
          
          if (b.specialState === 'landed') {
              b.state = 'landing_rest';
              b.velocity.set(0, 0, 0);
              b.group.position.x += (handTarget3D.x - b.group.position.x) * 0.08;
              b.group.position.y += (handTarget3D.y - b.group.position.y) * 0.08;
              b.group.position.z = handTarget3D.z;
              
              dummyObj.position.copy(b.group.position);
              dummyObj.lookAt(camera.position); 
              dummyObj.rotateY(Math.PI / 2);
              dummyObj.rotateZ(0.25);
              b.group.quaternion.slerp(dummyObj.quaternion, 0.18);
          }

          if (b.specialState === 'leaving') {
              spawnButterflyTrail(b.group.position);

              b.state = 'flying';
              _vLeave.z = b.group.position.z;
              _vDir.subVectors(_vLeave, b.group.position).normalize().multiplyScalar(0.18);
              b.velocity.lerp(_vDir, 0.08); 
              b.velocity.z = 0; 
              
              _vTargetPos.copy(b.group.position).add(b.velocity);
              dummyObj.position.copy(b.group.position);
              dummyObj.lookAt(_vTargetPos);
              b.group.quaternion.slerp(dummyObj.quaternion, 0.10);

              if (b.group.position.x > 20 || b.group.position.y > 20) {
                  scene.remove(b.group);
                  specialButterfly = null;
                  return;
              }
          }
      } 
      // 🌟 뒤쪽 일반 나비 제어
      else if (isHandDetected) {
          if (interactionMode === 'fist_gather' && fistButterflies.includes(b.id)) {
              isFollowing = true;
              b.state = 'flying';
              
              const orbitIdx = fistButterflies.indexOf(b.id);
              const orbitAngle = time * 2.2 + (orbitIdx * ((Math.PI * 2) / fistButterflies.length));
              const orbitRadius = 1.5 + (orbitIdx % 2) * 0.5;
              _vOrbit.set(Math.cos(orbitAngle) * orbitRadius, Math.sin(orbitAngle * 1.2) * 0.6, Math.sin(orbitAngle) * orbitRadius);
              _vTargetPos.copy(handTarget3D).add(_vOrbit);
              
              _vDir.subVectors(_vTargetPos, b.group.position).normalize().multiplyScalar(0.45);
              b.velocity.lerp(_vDir, 0.25);
              b.velocity.x += (Math.random() - 0.5) * 0.01;
              b.velocity.y += (Math.random() - 0.5) * 0.01;

              _vTargetPos.copy(b.group.position).add(b.velocity);
              dummyObj.position.copy(b.group.position);
              dummyObj.lookAt(_vTargetPos);
              const rollAngle = (b.velocity.x * -18);
              dummyObj.rotateZ(rollAngle); 
              b.group.quaternion.slerp(dummyObj.quaternion, 0.22);
          }
          // 🌟 [수정]: 손 펼쳤을 때(scatter) 너무 세게 날아가지 않도록 부드러운 힘(0.18)으로 완화
          else if (interactionMode === 'scatter') {
              const dist = b.group.position.distanceTo(handTarget3D);
              if (dist < 28.0) {
                  isFollowing = true;
                  b.state = 'flying';
                  _vDir.subVectors(b.group.position, handTarget3D);
                  _vDir.z = 0; 
                  _vDir.normalize();
                  b.velocity.addScaledVector(_vDir, 0.18); // 기존 0.35 -> 0.18로 대폭 완화
                  b.velocity.z *= 0.85; 
              }
          } 
      }

      if (!isFollowing && !b.isAscendingArrival) {
          b.state = 'flying';
          const t = time * 0.5 + b.seed;
          b.velocity.x += Math.sin(t * 1.4) * 0.002;
          b.velocity.y += Math.cos(t * 1.2) * 0.002;
          b.velocity.z += Math.sin(t * 1.5) * 0.001;

          if (Math.random() < 0.015) {
              b.velocity.x += (Math.random() - 0.5) * 0.05;
              b.velocity.y += (Math.random() - 0.5) * 0.05;
              b.velocity.z += (Math.random() - 0.5) * 0.02; 
          }
      }

      // 🌟 [수정]: 산란 시 최대 속도를 기존 1.0 -> 0.32로 줄여 자연스러운 유영 유지
      let maxSpeed = 0.10;
      if (b.isSpecialLanding) {
          maxSpeed = 0.26;
      } else if (isFollowing && interactionMode === 'scatter') {
          maxSpeed = 0.32; // 과속 방지
      } else if (isFollowing && interactionMode === 'fist_gather') {
          maxSpeed = 0.55;
      }

      if (b.velocity.length() > maxSpeed) {
          b.velocity.multiplyScalar(0.92);
      }
      
      b.group.position.add(b.velocity);

      if (!b.isSpecialLanding) {
          if (b.group.position.x > 18) b.velocity.x -= 0.012;
          if (b.group.position.x < -18) b.velocity.x += 0.012;
          if (b.group.position.y > 12) b.velocity.y -= 0.012;
          if (b.group.position.y < -12) b.velocity.y += 0.012;
          if (b.group.position.z > -2.0) b.velocity.z -= 0.02;
          if (b.group.position.z < -16.0) b.velocity.z += 0.02;
      }

      if (b.velocity.lengthSq() > 0.00001 && b.state === 'flying' && !isFollowing) {
        _vTargetPos.copy(b.group.position).add(b.velocity);
        dummyObj.position.copy(b.group.position);
        dummyObj.lookAt(_vTargetPos);
        const rollAngle = (b.velocity.x * -18) + Math.sin(time * 2 + b.seed) * 0.4;
        dummyObj.rotateZ(rollAngle); 
        b.group.quaternion.slerp(dummyObj.quaternion, 0.08);
      }
    }

    let releaseLandingTimer = null;

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      const time = clock.getElapsedTime();

      updateTrailParticles(dt);

      if (isHandDetected) {
        handTarget3D.lerp(targetHandPos3D, 0.25);
        currentScreenX += (targetScreenX - currentScreenX) * 0.3;
        currentScreenY += (targetScreenY - currentScreenY) * 0.3;
        if (handPointer) handPointer.style.transform = `translate3d(${currentScreenX}px, ${currentScreenY}px, 0)`;
        if (floatingConcernCard) { floatingConcernCard.style.left = `${currentScreenX}px`; floatingConcernCard.style.top = `${currentScreenY}px`; }
        if (floatingInfoCard) { floatingInfoCard.style.left = `${currentScreenX}px`; floatingInfoCard.style.top = `${currentScreenY}px`; }
      }

      // 🌟 손가락 하나 제스처 시 즉시 착석 나비 소환
      if (interactionMode === 'land_one' && isHandDetected) {
          if (releaseLandingTimer) {
              clearTimeout(releaseLandingTimer);
              releaseLandingTimer = null;
          }

          if (!specialButterfly) {
              let targetData = {};
              let isUserButterfly = false;
              if (rawUserDataList.length > 0) {
                  const randIdx = Math.floor(Math.random() * rawUserDataList.length);
                  targetData = rawUserDataList[randIdx];
                  isUserButterfly = true;
              }
              specialButterfly = buildButterfly(targetData, isUserButterfly, false, true, handTarget3D.z);
          }
      } else {
          if (specialButterfly && !releaseLandingTimer) {
              releaseLandingTimer = setTimeout(() => {
                  if (specialButterfly) specialButterfly.specialState = 'leaving';
                  resetLandingCards();
                  releaseLandingTimer = null;
              }, 450);
          }
      }

      for (let i = 0; i < defaultFlock.length; i++) updateMotion(defaultFlock[i], time);
      for (let i = 0; i < userFlock.length; i++) updateMotion(userFlock[i], time);
      if (specialButterfly) updateMotion(specialButterfly, time);
      
      prevHandTarget3D.copy(handTarget3D); 
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* ========================================================
       2. Supabase 실시간 연동
       ======================================================== */
    setTimeout(() => {
      try {
        if (window.supabase) {
          const SUPABASE_URL = 'https://djmdzsbfsobsutphragw.supabase.co';
          const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqbWR6c2Jmc29ic3V0cGhyYWd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4ODQ3NTgsImV4cCI6MjEwNTQ2MDc1OH0.BC7llaSjbq6cYhDlRqrwJaycpQ6gSNcp5LgYBeM6WEM';
          const supabaseInstance = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

          function addUserButterfly(data, isDelayedArrival = false) {
            rawUserDataList.push(data);
            if (rawUserDataList.length > 50) rawUserDataList.shift();
            if (userFlock.length >= MAX_USER_BUTTERFLIES) {
              const oldest = userFlock.shift();
              if (oldest && oldest.group) scene.remove(oldest.group);
            }
            userFlock.push(buildButterfly(data, true, isDelayedArrival, false));
          }

          supabaseInstance.from('butterflies').select('*').order('created_at', { ascending: false }).limit(MAX_USER_BUTTERFLIES)
            .then(({ data }) => { if (data) data.reverse().forEach(item => addUserButterfly(item, false)); })
            .catch(e => console.warn("Supabase 데이터 에러 무시"));

          supabaseInstance.channel('public:butterflies')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'butterflies' }, (payload) => {
              setTimeout(() => { addUserButterfly(payload.new, true); }, 10000);
            }).subscribe();
        }
      } catch (err) {}
    }, 1500);

    /* ========================================================
       3. 네이티브 웹캠 FHD 고화질 + AI 최적화 (안정적인 1손 추적)
       ======================================================== */
    setTimeout(() => {
      try {
        if (typeof Hands !== 'undefined') {
          const videoElement = document.getElementById('webcam-video');

          const offscreenCanvas = document.createElement('canvas');
          offscreenCanvas.width = 256;
          offscreenCanvas.height = 192;
          const offscreenCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });

          const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
          hands.setOptions({ 
            maxNumHands: 1,
            modelComplexity: 0, 
            minDetectionConfidence: 0.5, 
            minTrackingConfidence: 0.5 
          });
          
          hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
              const lm = results.multiHandLandmarks[0];
              const tip = lm[8]; 
              const mcp = lm[5]; 
              const wrist = lm[0];

              const palmSpan = Math.hypot(mcp.x - wrist.x, mcp.y - wrist.y);
              const rawPerspective = (palmSpan - 0.12) / (0.42 - 0.12);
              handPerspectiveScale = 0.55 + Math.max(0, Math.min(1, rawPerspective)) * 1.25;

              targetScreenX = (1 - tip.x) * window.innerWidth;
              targetScreenY = tip.y * window.innerHeight;
              handPointer.style.opacity = '1';

              const vec = new THREE.Vector3((1 - tip.x) * 2 - 1, -(tip.y * 2) + 1, 0.5);
              vec.unproject(camera);
              vec.sub(camera.position).normalize();
              
              const isIndexOpen = lm[8].y < lm[6].y;
              const isMiddleOpen = lm[12].y < lm[10].y;
              const isRingOpen = lm[16].y < lm[14].y;
              const isPinkyOpen = lm[20].y < lm[18].y;
              const isThumbOpen = Math.hypot(lm[4].x - lm[2].x, lm[4].y - lm[2].y) > 0.08;

              let foldedOthersCount = 0;
              if (!isMiddleOpen) foldedOthersCount++;
              if (!isRingOpen) foldedOthersCount++;
              if (!isPinkyOpen) foldedOthersCount++;

              let totalOpenFingers = 0;
              if (isThumbOpen) totalOpenFingers++;
              if (isIndexOpen) totalOpenFingers++;
              if (isMiddleOpen) totalOpenFingers++;
              if (isRingOpen) totalOpenFingers++;
              if (isPinkyOpen) totalOpenFingers++;

              const prevMode = interactionMode;

              // 1) 검지 손가락 하나 들기 (land_one)
              if (isIndexOpen && foldedOthersCount >= 2) {
                  interactionMode = 'land_one';
                  const distance = (8 - camera.position.z) / vec.z; 
                  targetHandPos3D.copy(camera.position).add(vec.multiplyScalar(distance));

              // 2) 손을 쫙 펴는 산란 (scatter)
              } else if (totalOpenFingers >= 4 && isMiddleOpen && isRingOpen && isPinkyOpen) {
                  interactionMode = 'scatter';
                  const distance = (8 - camera.position.z) / vec.z; 
                  targetHandPos3D.copy(camera.position).add(vec.multiplyScalar(distance));
                  resetLandingCards();

              // 3) 주먹 쥐기 (fist_gather)
              } else if (totalOpenFingers <= 1 && !isIndexOpen && !isMiddleOpen) {
                  interactionMode = 'fist_gather';
                  const distance = (0 - camera.position.z) / vec.z; 
                  targetHandPos3D.copy(camera.position).add(vec.multiplyScalar(distance));
                  resetLandingCards();

                  if (prevMode !== 'fist_gather') {
                      const allFlock = [...defaultFlock, ...userFlock];
                      allFlock.sort((a, b) => a.group.position.distanceTo(handTarget3D) - b.group.position.distanceTo(handTarget3D));
                      fistButterflies = allFlock.slice(0, 5).map(b => b.id);
                  }
              } else {
                  interactionMode = 'none';
                  fistButterflies = [];
                  resetLandingCards();
              }
              isHandDetected = true;
            } else {
              handPointer.style.opacity = '0';
              isHandDetected = false;
              interactionMode = 'none';
              fistButterflies = [];
              handPerspectiveScale = 1.0;
              resetLandingCards();
            }
          });

          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({
              video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } },
              audio: false
            }).then((stream) => {
              videoElement.srcObject = stream;
              videoElement.onloadedmetadata = () => {
                videoElement.play();
                let isProcessingFrame = false;
                function processVideoLoop() {
                  if (!isProcessingFrame && videoElement.readyState >= 2) {
                    isProcessingFrame = true;
                    offscreenCtx.drawImage(videoElement, 0, 0, 256, 192);
                    hands.send({ image: offscreenCanvas })
                      .catch(() => {})
                      .finally(() => {
                        isProcessingFrame = false;
                        setTimeout(processVideoLoop, 85);
                      });
                  } else {
                    setTimeout(processVideoLoop, 85);
                  }
                }
                processVideoLoop();
              };
            }).catch((err) => { console.warn("웹캠 접근 실패:", err); });
          }
        }
      } catch (err) {}
    }, 2000);
  </script>
</body>
