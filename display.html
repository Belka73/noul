<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOUL : Luminous Space</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: #000000; user-select: none; cursor: none;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard Variable", Pretendard, sans-serif;
    }
    #webcam-video {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; transform: scaleX(-1);
      filter: brightness(0.2) contrast(1.2);
      z-index: 0; pointer-events: none;
    }
    #three-canvas-container {
      position: absolute; inset: 0; z-index: 10;
    }
    #hand-pointer {
      position: absolute; width: 60px; height: 60px;
      margin-left: -30px; margin-top: -30px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.35) 45%, rgba(255, 255, 255, 0) 70%);
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.9), 0 0 70px rgba(255, 255, 255, 0.4);
      pointer-events: none; z-index: 30; opacity: 0; transition: opacity 0.3s ease;
    }

    /* 🌟 외곽이 완벽히 번져있는 타원형 흰색 빛 블러 말풍선 (사진 레퍼런스 동일 구현) */
    #floating-info-card {
      position: absolute;
      transform: translate(45px, -115%);
      width: 320px;
      min-height: 180px;
      padding: 40px 38px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
      z-index: 40;
      opacity: 0;
      transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 🌟 외곽선 없이 부드럽게 퍼지는 안개빛 블러 레이어 */
    #floating-info-card::before {
      content: '';
      position: absolute;
      inset: -25px;
      background: radial-gradient(ellipse 65% 55% at center, rgba(255, 255, 255, 1.0) 0%, rgba(255, 255, 255, 0.92) 28%, rgba(255, 255, 255, 0.55) 55%, rgba(255, 255, 255, 0.15) 75%, rgba(255, 255, 255, 0) 100%);
      filter: blur(18px);
      z-index: -1;
      border-radius: 50%;
    }

    #floating-info-card.visible {
      opacity: 1;
      transform: translate(45px, -125%);
    }

    #floating-butterfly-name {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #08080a;
      margin-bottom: 5px;
      z-index: 2;
    }
    #floating-butterfly-memo {
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.45;
      color: #1a1a20;
      word-break: keep-all;
      z-index: 2;
    }
  </style>
</head>
<body>

  <video id="webcam-video" playsinline autoplay muted></video>
  <div id="three-canvas-container"></div>
  <div id="hand-pointer"></div>

  <!-- 검지 착석 안내 카드 (외곽이 흐리게 번지는 흰색 블러 형태) -->
  <div id="floating-info-card">
    <div id="floating-butterfly-name">‘나비’</div>
    <div id="floating-butterfly-memo">너의 찬란한 날갯짓을 응원해.</div>
  </div>

  <script>
    /* ========================================================
       1. 안전한 지오메트리 세팅 및 3D 씬 강제 구축
       ======================================================== */
    function createStableWingGeom(isRight) {
      const shape = new THREE.Shape();
      const s = isRight ? 1 : -1;
      shape.moveTo(0, 0.5);
      shape.bezierCurveTo(s * 0.4, 1.0, s * 1.5, 2.0, s * 2.4, 1.8);
      shape.bezierCurveTo(s * 3.0, 1.6, s * 2.8, 0.8, s * 2.2, 0.2);
      shape.bezierCurveTo(s * 2.5, -0.4, s * 2.2, -1.5, s * 1.6, -1.8);
      shape.bezierCurveTo(s * 1.0, -2.0, s * 0.4, -1.6, s * 0.2, -1.0);
      shape.bezierCurveTo(s * 0.1, -0.6, s * 0.05, -0.2, 0, -0.5);
      shape.lineTo(0, 0.5);

      const geom = new THREE.ShapeGeometry(shape, 24);
      geom.computeVertexNormals();
      geom.computeBoundingBox();
      const bb = geom.boundingBox;
      const sizeX = bb.max.x - bb.min.x || 1;
      const sizeY = bb.max.y - bb.min.y || 1;
      const pos = geom.attributes.position;
      const uvs = [];

      for (let i = 0; i < pos.count; i++) {
        uvs.push((pos.getX(i) - bb.min.x) / sizeX, (pos.getY(i) - bb.min.y) / sizeY);
      }
      geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      return geom;
    }

    function createBodyGeom() {
      const points = [
        new THREE.Vector2(0.001, 0.8), new THREE.Vector2(0.14, 0.7),
        new THREE.Vector2(0.10, 0.5), new THREE.Vector2(0.18, 0.3),
        new THREE.Vector2(0.12, 0.0), new THREE.Vector2(0.15, -0.2),
        new THREE.Vector2(0.12, -0.4), new THREE.Vector2(0.08, -0.7),
        new THREE.Vector2(0.001, -0.9)
      ];
      return new THREE.LatheGeometry(points, 16);
    }

    function createAntenna(isRight, mat) {
      const group = new THREE.Group();
      const s = isRight ? 1 : -1;
      const curve = new THREE.CubicBezierCurve3(
        new THREE.Vector3(0, 0, 0), new THREE.Vector3(s * 0.2, 0.5, 0.1),
        new THREE.Vector3(s * 0.5, 0.9, 0.2), new THREE.Vector3(s * 0.65, 1.2, 0.3)
      );
      group.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 16, 0.035, 6, false), mat));
      const tip = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 10), mat);
      tip.position.set(s * 0.65, 1.2, 0.3);
      group.add(tip);
      return group;
    }

    const container = document.getElementById('three-canvas-container');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 14.5);

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(1);
    container.appendChild(renderer.domElement);

    const textureLoader = new THREE.TextureLoader();
    const gltfLoader = new THREE.GLTFLoader();
    const leftGeom = createStableWingGeom(false);
    const rightGeom = createStableWingGeom(true);
    const bodyGeom = createBodyGeom();

    const defaultFlock = [];
    const userFlock = [];
    // 🌟 나비 개체 수 확장: 유저 나비 최대 15마리
    const MAX_USER_BUTTERFLIES = 15;

    function buildButterfly(data = {}, isUser = false, isDelayedArrival = false) {
      const group = new THREE.Group();
      const innerGroup = new THREE.Group(); 
      
      let wingMat = new THREE.MeshBasicMaterial({ 
        color: 0xffffff, 
        side: THREE.DoubleSide, 
        transparent: false, 
        alphaTest: 0.5 
      });
      if (isUser && data.texture_url && data.texture_url.startsWith('data:image')) {
        const userTex = textureLoader.load(data.texture_url);
        userTex.flipY = false;
        wingMat = new THREE.MeshBasicMaterial({ 
          map: userTex, 
          side: THREE.DoubleSide, 
          transparent: false, 
          alphaTest: 0.5 
        });
      }

      const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      let leftWing = new THREE.Mesh(leftGeom, wingMat);
      let rightWing = new THREE.Mesh(rightGeom, wingMat);
      const defaultBody = new THREE.Mesh(bodyGeom, whiteMat);
      
      innerGroup.add(leftWing);
      innerGroup.add(rightWing);
      innerGroup.add(defaultBody);
      
      const aL = createAntenna(false, whiteMat); aL.position.set(-0.05, 0.7, 0.15); innerGroup.add(aL);
      const aR = createAntenna(true, whiteMat); aR.position.set(0.05, 0.7, 0.15); innerGroup.add(aR);

      innerGroup.rotation.x = Math.PI / 2;
      group.add(innerGroup);

      const shapeId = data.wing_shape || 'crescent';
      const antId = data.antenna_type || 'ball';
      const targetAntennaPrefix = 'Antenna_' + antId;
      const modelPath = '3DButterfly/' + shapeId + '.glb';

      if (isUser && gltfLoader) {
        gltfLoader.load(modelPath, function(gltf) {
          const model = gltf.scene;
          let newWingL = null;
          let newWingR = null;

          model.traverse(function(child) {
            if (child.isMesh) {
              const name = child.name;
              if (name.startsWith('Wing_L')) { newWingL = child; child.material = wingMat; }
              else if (name.startsWith('Wing_R')) { newWingR = child; child.material = wingMat; }
              else if (name.startsWith('Body')) { child.material = whiteMat; }
              else if (name.startsWith('Antenna_')) { child.material = whiteMat; child.visible = name.startsWith(targetAntennaPrefix); }
            }
          });

          if (newWingL && newWingR) {
            innerGroup.remove(leftWing);
            innerGroup.remove(rightWing);
            innerGroup.remove(defaultBody);
            innerGroup.remove(aL);
            innerGroup.remove(aR);

            model.scale.set(0.95, 0.95, 0.95);
            innerGroup.add(model);

            butterflyRecord.leftWing = newWingL;
            butterflyRecord.rightWing = newWingR;
          }
        }, undefined, function() {});
      }

      let initialVelocity;
      let targetScale = 0.38 + Math.random() * 0.14;

      if (isDelayedArrival) {
        group.position.set((Math.random() - 0.5) * 5, -8.0, 1.0);
        initialVelocity = new THREE.Vector3((Math.random() - 0.5) * 0.06, 0.16, -0.04);
        group.scale.set(0.01, 0.01, 0.01);
      } else {
        group.position.set(
          (Math.random() - 0.5) * 30, 
          (Math.random() - 0.5) * 18, 
          -12.0 - Math.random() * 16.0
        );
        initialVelocity = new THREE.Vector3((Math.random() - 0.5) * 0.15, (Math.random() - 0.5) * 0.15, (Math.random() - 0.5) * 0.08);
        group.scale.set(targetScale, targetScale, targetScale);
      }

      scene.add(group);

      const butterflyRecord = {
        id: Math.random().toString(36).substring(7),
        group, innerGroup, leftWing, rightWing,
        velocity: initialVelocity,
        speed: 18.0 + Math.random() * 8.0, 
        seed: Math.random() * 1000,
        flapAmp: 1.0, 
        state: 'flying',
        targetScale: targetScale,
        isAscendingArrival: isDelayedArrival,
        arrivalTimer: 0,
        isSpecialLanding: false,
        specialState: null,
        name: data.name || (isUser ? "익명의 나비" : "나비"),
        memo: data.memo || "너의 찬란한 날갯짓을 응원해."
      };

      return butterflyRecord;
    }

    // 🌟 기본 나비 15마리
    for (let i = 0; i < 15; i++) {
      defaultFlock.push(buildButterfly({}, false, false));
    }

    const clock = new THREE.Clock();
    const dummyObj = new THREE.Object3D(); 
    let handTarget3D = new THREE.Vector3(999, 999, 0);
    let targetHandPos3D = new THREE.Vector3(999, 999, 0);
    let prevHandTarget3D = new THREE.Vector3(999, 999, 0);
    let isHandDetected = false;
    let interactionMode = 'none';
    let landingButterflyId = null; 
    let fistButterflies = []; 
    let fingerAngle = 1.0; 
    let handPerspectiveScale = 1.0;

    const floatingInfoCard = document.getElementById('floating-info-card');
    const floatingName = document.getElementById('floating-butterfly-name');
    const floatingMemo = document.getElementById('floating-butterfly-memo');

    let currentScreenX = 0, currentScreenY = 0;
    let targetScreenX = 0, targetScreenY = 0;
    const handPointer = document.getElementById('hand-pointer');

    function updateMotion(b, time) {
      let currentTargetScale = b.targetScale;
      if (b.isSpecialLanding && b.specialState === 'landed') {
        currentTargetScale = b.targetScale * handPerspectiveScale;
      }

      if (b.isAscendingArrival) {
        b.arrivalTimer += 0.016;
        b.group.scale.lerp(new THREE.Vector3(b.targetScale, b.targetScale, b.targetScale), 0.06);
        b.velocity.y *= 0.99;

        if (b.arrivalTimer > 4.5 || b.group.position.y > 0) {
          b.isAscendingArrival = false; 
        }
      } else {
        b.group.scale.lerp(new THREE.Vector3(currentTargetScale, currentTargetScale, currentTargetScale), 0.1);
      }

      if (b.state === 'landing_rest') {
          b.flapAmp *= 0.88; 
          const flap = Math.sin(time * b.speed + b.seed) * 0.12 * b.flapAmp;
          const restFold = -1.25; 
          b.leftWing.rotation.y = flap + restFold * (1 - b.flapAmp);
          b.rightWing.rotation.y = -flap - restFold * (1 - b.flapAmp);
      } else {
          b.flapAmp += (1.0 - b.flapAmp) * 0.1; 
          const flapSpeed = b.isAscendingArrival ? (b.speed * 1.5) : b.speed;
          const flap = Math.sin(time * flapSpeed + b.seed) * 0.65 * b.flapAmp;
          b.leftWing.rotation.y = flap;
          b.rightWing.rotation.y = -flap;
      }

      let isFollowing = false;

      // 손가락 착석 로직
      if (b.isSpecialLanding) {
          isFollowing = true;

          if (b.specialState === 'approaching') {
              const dist = b.group.position.distanceTo(handTarget3D);
              if (dist < 1.5) {
                  b.specialState = 'landed';
                  if (floatingInfoCard) {
                    floatingName.innerText = `‘${b.name}’`;
                    floatingMemo.innerText = b.memo;
                    floatingInfoCard.classList.add('visible');
                  }
              } else {
                  b.state = 'flying';
                  const dir = new THREE.Vector3().subVectors(handTarget3D, b.group.position).normalize();
                  b.velocity.lerp(dir.multiplyScalar(0.5), 0.15); 
                  
                  const targetPos = b.group.position.clone().add(b.velocity);
                  dummyObj.position.copy(b.group.position);
                  dummyObj.lookAt(targetPos);
                  const rollAngle = (b.velocity.x * -15);
                  dummyObj.rotateZ(rollAngle); 
                  b.group.quaternion.slerp(dummyObj.quaternion, 0.2);
              }
          }
          
          if (b.specialState === 'landed') {
              b.state = 'landing_rest';
              b.velocity.set(0, 0, 0);
              b.group.position.lerp(handTarget3D, 0.3); 
              
              dummyObj.position.copy(b.group.position);
              dummyObj.lookAt(camera.position); 
              dummyObj.rotateY(Math.PI / 2);
              dummyObj.rotateZ(0.25);
              
              b.group.quaternion.slerp(dummyObj.quaternion, 0.2);
          }

          // 🌟 수정사항 1: 손가락에 앉았던 나비가 퇴장할 때 좀 더 느리고 우아하게 나가도록 속도 완화 (0.6 -> 0.22)
          if (b.specialState === 'leaving') {
              b.state = 'flying';
              const leaveTarget = new THREE.Vector3(25, 25, b.group.position.z - 2);
              const dir = new THREE.Vector3().subVectors(leaveTarget, b.group.position).normalize();
              b.velocity.lerp(dir.multiplyScalar(0.22), 0.08); 
              
              const targetPos = b.group.position.clone().add(b.velocity);
              dummyObj.position.copy(b.group.position);
              dummyObj.lookAt(targetPos);
              b.group.quaternion.slerp(dummyObj.quaternion, 0.12);

              if (b.group.position.x > 20 || b.group.position.y > 20) {
                  b.isSpecialLanding = false;
                  b.specialState = null;
              }
          }
      } 
      else if (isHandDetected) {
          // 🌟 수정사항 3: 주먹으로 모였을 때 주먹 중심이 아닌, 주먹 주변을 자연스럽게 맴돌며 비행
          if (interactionMode === 'fist_gather' && fistButterflies.includes(b.id)) {
              isFollowing = true;
              b.state = 'flying';
              
              const orbitIdx = fistButterflies.indexOf(b.id);
              const orbitAngle = time * 2.2 + (orbitIdx * ((Math.PI * 2) / fistButterflies.length));
              const orbitRadius = 1.8 + (orbitIdx % 2) * 0.6;
              const orbitOffset = new THREE.Vector3(
                Math.cos(orbitAngle) * orbitRadius,
                Math.sin(orbitAngle * 1.3) * 0.8,
                Math.sin(orbitAngle) * orbitRadius
              );
              const targetOrbitPos = handTarget3D.clone().add(orbitOffset);
              
              const dir = new THREE.Vector3().subVectors(targetOrbitPos, b.group.position).normalize();
              b.velocity.lerp(dir.multiplyScalar(0.35), 0.18);
              b.velocity.add(new THREE.Vector3((Math.random() - 0.5) * 0.04, (Math.random() - 0.5) * 0.04, (Math.random() - 0.5) * 0.04));

              const targetPos = b.group.position.clone().add(b.velocity);
              dummyObj.position.copy(b.group.position);
              dummyObj.lookAt(targetPos);
              const rollAngle = (b.velocity.x * -25);
              dummyObj.rotateZ(rollAngle); 
              b.group.quaternion.slerp(dummyObj.quaternion, 0.22);
          }
          // 🌟 수정사항 2: 손을 폈을 때 좀 더 팡 하고 강하게 흩어지도록 밀어내는 힘 대폭 강화 (0.1 -> 0.45)
          else if (interactionMode === 'scatter') {
              const dist = b.group.position.distanceTo(handTarget3D);
              if (dist < 32.0) {
                  isFollowing = true;
                  b.state = 'flying';
                  const dir = new THREE.Vector3().subVectors(b.group.position, handTarget3D).normalize();
                  b.velocity.addScaledVector(dir, 0.45);
              }
          } 
      }

      if (!isFollowing && !b.isAscendingArrival) {
          b.state = 'flying';
          const t = time * 0.8 + b.seed;
          b.velocity.x += Math.sin(t * 1.8) * 0.004;
          b.velocity.y += Math.cos(t * 1.5) * 0.004;
          b.velocity.z += Math.sin(t * 2.0) * 0.002;

          if (Math.random() < 0.015) {
              b.velocity.x += (Math.random() - 0.5) * 0.14;
              b.velocity.y += (Math.random() - 0.5) * 0.14;
              b.velocity.z += (Math.random() - 0.5) * 0.08; 
          }
      }

      // 🌟 손을 폈을 때 팡 터지는 최대 속도 한계치 확장 (0.8 -> 1.6)
      let maxSpeed = isFollowing ? 0.5 : 0.22;
      if (interactionMode === 'scatter') maxSpeed = 1.6;
      if (b.isAscendingArrival) maxSpeed = 0.35;

      if (b.velocity.length() > maxSpeed) {
          b.velocity.multiplyScalar(0.95);
      }
      
      b.group.position.add(b.velocity);

      // 일반 나비 비행 레이어 영역 유지
      if (!b.isSpecialLanding || b.specialState !== 'leaving') {
          if (b.group.position.x > 18) b.velocity.x -= 0.02;
          if (b.group.position.x < -18) b.velocity.x += 0.02;
          if (b.group.position.y > 12) b.velocity.y -= 0.02;
          if (b.group.position.y < -12) b.velocity.y += 0.02;
          if (b.group.position.z > -8.0) b.velocity.z -= 0.035;
          if (b.group.position.z < -28.0) b.velocity.z += 0.035;
      }

      if (b.velocity.lengthSq() > 0.00001 && b.state === 'flying' && !isFollowing) {
        const targetPos = b.group.position.clone().add(b.velocity);
        dummyObj.position.copy(b.group.position);
        dummyObj.lookAt(targetPos);
        const rollAngle = (b.velocity.x * -25) + Math.sin(time * 3 + b.seed) * 0.6;
        const pitchAngle = Math.sin(time * 2.5 + b.seed) * 0.4;
        dummyObj.rotateZ(rollAngle); 
        dummyObj.rotateX(pitchAngle); 
        b.group.quaternion.slerp(dummyObj.quaternion, 0.1);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      if (isHandDetected) {
        handTarget3D.lerp(targetHandPos3D, 0.25);
        currentScreenX += (targetScreenX - currentScreenX) * 0.3;
        currentScreenY += (targetScreenY - currentScreenY) * 0.3;
        if (handPointer) {
          handPointer.style.transform = `translate3d(${currentScreenX}px, ${currentScreenY}px, 0)`;
        }
        if (floatingInfoCard) {
          floatingInfoCard.style.left = `${currentScreenX}px`;
          floatingInfoCard.style.top = `${currentScreenY}px`;
        }
      }

      if (interactionMode === 'land_one' && isHandDetected) {
          if (!landingButterflyId) {
              const allFlock = [...defaultFlock, ...userFlock];
              const randIdx = Math.floor(Math.random() * allFlock.length);
              const selected = allFlock[randIdx];
              
              landingButterflyId = selected.id;
              selected.isSpecialLanding = true;
              selected.specialState = 'approaching';

              selected.group.position.set(-18, 14, handTarget3D.z);
              selected.velocity.set(0, 0, 0); 
          }
      } else {
          if (landingButterflyId) {
              const allFlock = [...defaultFlock, ...userFlock];
              const selected = allFlock.find(b => b.id === landingButterflyId);
              if (selected) {
                  selected.specialState = 'leaving';
              }
              landingButterflyId = null;
              if (floatingInfoCard) floatingInfoCard.classList.remove('visible');
          }
      }

      defaultFlock.forEach(b => updateMotion(b, time));
      userFlock.forEach(b => updateMotion(b, time));
      
      prevHandTarget3D.copy(handTarget3D); 
      
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* ========================================================
       2. Supabase 실시간 연동 & 정확한 10초 뒤 합류 로직
       ======================================================== */
    setTimeout(() => {
      try {
        if (window.supabase) {
          const SUPABASE_URL = 'https://djmdzsbfsobsutphragw.supabase.co';
          const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqbWR6c2Jmc29ic3V0cGhyYWd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4ODQ3NTgsImV4cCI6MjEwNTQ2MDc1OH0.BC7llaSjbq6cYhDlRqrwJaycpQ6gSNcp5LgYBeM6WEM';
          const supabaseInstance = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

          function addUserButterfly(data, isDelayedArrival = false) {
            if (userFlock.length >= MAX_USER_BUTTERFLIES) {
              const oldest = userFlock.shift();
              if (oldest && oldest.group) scene.remove(oldest.group);
            }
            userFlock.push(buildButterfly(data, true, isDelayedArrival));
          }

          supabaseInstance.from('butterflies').select('*').order('created_at', { ascending: false }).limit(MAX_USER_BUTTERFLIES)
            .then(({ data }) => { if (data) data.reverse().forEach(item => addUserButterfly(item, false)); })
            .catch(e => console.warn("Supabase 데이터 에러 무시"));

          supabaseInstance.channel('public:butterflies')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'butterflies' }, (payload) => {
              console.log("새 나비 전송 감지! 10초 카운트다운 시작:", payload.new.name);
              
              setTimeout(() => {
                console.log("10초 경과: 나비 공간 합류!", payload.new.name);

    /* ========================================================
       3. MediaPipe 초정밀 AR 매핑 및 제스처 모드 (퍼지기/모이기)
       ======================================================== */
    setTimeout(() => {
      try {
        if (typeof Hands !== 'undefined' && typeof Camera !== 'undefined') {
          const videoElement = document.getElementById('webcam-video');

          const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
          hands.setOptions({ 
            maxNumHands: 1, 
            modelComplexity: 0, 
            minDetectionConfidence: 0.5, 
            minTrackingConfidence: 0.5 
          });
          
          hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
              const lm = results.multiHandLandmarks[0];
              const tip = lm[8]; 
              const mcp = lm[5]; 
              const wrist = lm[0];

              // 웹캠 기준 손바닥 크기로 원근감 측정
              const palmSpan = Math.hypot(mcp.x - wrist.x, mcp.y - wrist.y);
              const rawPerspective = (palmSpan - 0.12) / (0.42 - 0.12);
              const clampedPerspective = Math.max(0, Math.min(1, rawPerspective));
              handPerspectiveScale = 0.55 + clampedPerspective * 1.25;

              const vx = (1 - tip.x) - (1 - mcp.x);
              const vy = -(tip.y - mcp.y); 
              const rawAngle = Math.atan2(vy, vx);
              
              fingerAngle = rawAngle - (Math.PI / 2) + 1.2;

              targetScreenX = (1 - tip.x) * window.innerWidth;
              targetScreenY = tip.y * window.innerHeight;
              handPointer.style.opacity = '1';

              const vec = new THREE.Vector3((1 - tip.x) * 2 - 1, -(tip.y * 2) + 1, 0.5);
              vec.unproject(camera);
              vec.sub(camera.position).normalize();
              
              let openFingers = 0;
              const tips = [8, 12, 16, 20];
              const pips = [6, 10, 14, 18];
              for(let i=0; i<4; i++) {
                  if(Math.hypot(lm[tips[i]].x - wrist.x, lm[tips[i]].y - wrist.y) > Math.hypot(lm[pips[i]].x - wrist.x, lm[pips[i]].y - wrist.y) * 1.1) openFingers++;
              }
              
              const prevMode = interactionMode;
              if (openFingers >= 3) {
                  interactionMode = 'scatter';
                  handPointer.style.background = 'radial-gradient(circle, rgba(200, 230, 255, 0.95) 0%, rgba(100, 150, 255, 0.4) 40%, rgba(255, 255, 255, 0) 70%)';
                  const distance = (8 - camera.position.z) / vec.z; 
                  targetHandPos3D.copy(camera.position).add(vec.multiplyScalar(distance));
                  if (floatingInfoCard) floatingInfoCard.classList.remove('visible');

              } else if (openFingers === 1) {
                  interactionMode = 'land_one';
                  handPointer.style.background = 'radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(150, 200, 255, 0.4) 40%, rgba(255, 255, 255, 0) 70%)';
                  const distance = (8 - camera.position.z) / vec.z; 
                  targetHandPos3D.copy(camera.position).add(vec.multiplyScalar(distance));

              } else if (openFingers === 0) {
                  interactionMode = 'fist_gather';
                  handPointer.style.background = 'radial-gradient(circle, rgba(255, 200, 200, 0.9) 0%, rgba(255, 100, 100, 0.3) 40%, rgba(255, 255, 255, 0) 70%)';
                  const distance = (0 - camera.position.z) / vec.z; 
                  targetHandPos3D.copy(camera.position).add(vec.multiplyScalar(distance));
                  if (floatingInfoCard) floatingInfoCard.classList.remove('visible');

                  // 🌟 수정사항 3: 주먹을 쥐었을 때 딱 5마리만 선별
                  if (prevMode !== 'fist_gather') {
                      const allFlock = [...defaultFlock, ...userFlock];
                      allFlock.sort((a, b) => a.group.position.distanceTo(handTarget3D) - b.group.position.distanceTo(handTarget3D));
                      fistButterflies = allFlock.slice(0, 5).map(b => b.id);
                  }
              } else {
                  interactionMode = 'none';
                  handPointer.style.background = 'radial-gradient(circle, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0.1) 40%, rgba(255, 255, 255, 0) 70%)';
                  fistButterflies = [];
                  if (floatingInfoCard) floatingInfoCard.classList.remove('visible');
              }
              isHandDetected = true;
            } else {
              handPointer.style.opacity = '0';
              isHandDetected = false;
              interactionMode = 'none';
              fistButterflies = [];
              handPerspectiveScale = 1.0;
              if (floatingInfoCard) floatingInfoCard.classList.remove('visible');
          }
          });

          let isProcessing = false;
          let lastProcessTime = 0;

          new Camera(videoElement, { 
            onFrame: async () => { 
              const now = performance.now();
              if (isProcessing || (now - lastProcessTime < 55)) return; 
              
              isProcessing = true;
              try {
                await hands.send({ image: videoElement });
                lastProcessTime = now;
              } catch (e) {} finally {
                isProcessing = false;
              }
            }, 
            width: 480, 
            height: 360 
          }).start().catch(()=>{});
        }
      } catch (err) {}
    }, 2000);
  </script>
