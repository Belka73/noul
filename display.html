<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOUL : Luminous Space</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- MediaPipe Hands & Camera Utils CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      user-select: none;
      cursor: none; /* 전시 몰입감을 위해 마우스 커서 숨김 */
    }

    /* 웹캠 배경 (어둡고 몽환적인 실루엣 거울 효과) */
    #webcam-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      filter: brightness(0.2) contrast(1.3) saturate(0.3) blur(3px);
      z-index: 0;
      pointer-events: none;
    }

    #three-canvas-container {
      position: absolute;
      inset: 0;
      z-index: 10;
    }

    /* 손끝 인터랙션 빛 파티클 */
    #hand-pointer {
      position: absolute;
      width: 60px;
      height: 60px;
      margin-left: -30px;
      margin-top: -30px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.3) 45%, rgba(255, 255, 255, 0) 70%);
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.9), 0 0 70px rgba(255, 255, 255, 0.4);
      pointer-events: none;
      z-index: 30;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body>

  <!-- 어떠한 글자나 HUD도 없는 완전한 인터랙티브 스크린 -->
  <video id="webcam-video" playsinline autoplay muted></video>
  <div id="three-canvas-container"></div>
  <div id="hand-pointer"></div>

  <script>
    /* 1. Supabase 연동 세팅 */
    const SUPABASE_URL = 'https://djmdzsbfsobsutphragw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqbWR6c2Jmc29ic3V0cGhyYWd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4ODQ3NTgsImV4cCI6MjEwNTQ2MDc1OH0.BC7llaSjbq6cYhDlRqrwJaycpQ6gSNcp5LgYBeM6WEM';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /* 2. 나비 3D 지오메트리 */
    function createCustomWingShape(shapeType, isRight) {
      const shape = new THREE.Shape();
      const s = isRight ? 1 : -1;
      shape.moveTo(0, 0.48);

      if (shapeType === 'pointy') {
        shape.bezierCurveTo(s * 0.12, 1.05, s * 0.75, 2.58, s * 1.75, 2.65);
        shape.bezierCurveTo(s * 1.95, 1.82, s * 1.55, 1.05, s * 1.12, 0.18);
        shape.bezierCurveTo(s * 1.68, -0.22, s * 1.82, -1.35, s * 1.28, -1.92);
        shape.bezierCurveTo(s * 0.88, -2.15, s * 0.45, -1.88, s * 0.25, -1.48);
        shape.bezierCurveTo(s * 0.15, -1.15, s * 0.05, -0.72, 0, -0.48);
      } else if (shapeType === 'flutter') {
        shape.bezierCurveTo(s * 0.35, 0.85, s * 1.35, 1.75, s * 2.38, 1.52);
        shape.bezierCurveTo(s * 2.82, 1.05, s * 2.25, 0.45, s * 2.65, -0.05);
        shape.bezierCurveTo(s * 2.78, -0.52, s * 2.05, -0.78, s * 1.65, -0.85);
        shape.bezierCurveTo(s * 2.22, -1.25, s * 1.95, -1.95, s * 1.35, -2.08);
        shape.bezierCurveTo(s * 0.88, -2.15, s * 0.48, -1.65, s * 0.25, -1.42);
        shape.bezierCurveTo(s * 0.15, -1.15, s * 0.05, -0.72, 0, -0.48);
      } else if (shapeType === 'fairy') {
        shape.bezierCurveTo(s * 0.18, 1.02, s * 0.98, 2.52, s * 1.95, 2.68);
        shape.bezierCurveTo(s * 2.12, 1.82, s * 1.45, 1.08, s * 1.28, 0.25);
        shape.bezierCurveTo(s * 1.88, -0.15, s * 2.05, -1.32, s * 1.48, -2.15);
        shape.bezierCurveTo(s * 1.08, -2.42, s * 0.62, -2.25, s * 0.35, -1.78);
        shape.bezierCurveTo(s * 0.18, -1.28, s * 0.08, -0.78, 0, -0.48);
      } else {
        shape.bezierCurveTo(s * 0.32, 0.88, s * 1.15, 1.78, s * 1.95, 1.72);
        shape.bezierCurveTo(s * 2.58, 1.68, s * 2.78, 1.18, s * 2.45, 0.62);
        shape.bezierCurveTo(s * 2.18, 0.22, s * 1.78, 0.02, s * 1.35, -0.08);
        shape.bezierCurveTo(s * 1.80, -0.35, s * 1.80, -1.08, s * 1.45, -1.52);
        shape.bezierCurveTo(s * 1.05, -1.92, s * 0.55, -1.82, s * 0.32, -1.48);
        shape.bezierCurveTo(s * 0.16, -1.15, s * 0.05, -0.72, 0, -0.48);
      }
      shape.lineTo(0, 0.48);
      shape.closePath();

      const geom = new THREE.ShapeGeometry(shape, 24);
      geom.computeVertexNormals();
      return geom;
    }

    function createSegmentedBodyGeometry() {
      const points = [
        new THREE.Vector2(0.001, 0.5),
        new THREE.Vector2(0.08, 0.3),
        new THREE.Vector2(0.06, 0.0),
        new THREE.Vector2(0.08, -0.2),
        new THREE.Vector2(0.001, -0.5)
      ];
      return new THREE.LatheGeometry(points, 12);
    }

    function createGlowSprite() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
      grad.addColorStop(0.3, 'rgba(255, 255, 255, 0.3)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);

      const texture = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({
        map: texture,
        blending: THREE.AdditiveBlending,
        transparent: true,
        opacity: 0.5
      });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(3.2, 3.2, 1);
      return sprite;
    }

    /* 3. Three.js 씬 세팅 */
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.z = 20;

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('three-canvas-container').appendChild(renderer.domElement);

    const butterflies = [];
    const whiteBodyMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const textureLoader = new THREE.TextureLoader();
    const shapes = ['round', 'pointy', 'flutter', 'fairy'];

    function spawnButterfly(itemData, isNew = false) {
      const group = new THREE.Group();

      let wingMat;
      if (itemData.texture_url && itemData.texture_url.startsWith('data:image')) {
        const tex = textureLoader.load(itemData.texture_url);
        wingMat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide, transparent: true, opacity: 0.95 });
      } else {
        wingMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
      }

      const shape = itemData.wing_shape || shapes[Math.floor(Math.random() * shapes.length)];
      const leftWing = new THREE.Mesh(createCustomWingShape(shape, false), wingMat);
      const rightWing = new THREE.Mesh(createCustomWingShape(shape, true), wingMat);
      group.add(leftWing);
      group.add(rightWing);

      const body = new THREE.Mesh(createSegmentedBodyGeometry(), whiteBodyMat);
      group.add(body);

      const glow = createGlowSprite();
      glow.position.z = -0.1;
      group.add(glow);

      if (isNew) {
        group.position.set(0, -9, 0); // 새 나비는 화면 아래에서 날아오름
      } else {
        group.position.set(
          (Math.random() - 0.5) * 26,
          (Math.random() - 0.5) * 16,
          (Math.random() - 0.5) * 10
        );
      }
      
      const randomScale = 0.28 + Math.random() * 0.2;
      group.scale.set(randomScale, randomScale, randomScale);
      scene.add(group);

      butterflies.push({
        group,
        leftWing,
        rightWing,
        velocity: new THREE.Vector3((Math.random() - 0.5) * 0.03, (Math.random() - 0.5) * 0.03, (Math.random() - 0.5) * 0.02),
        speed: 5.5 + Math.random() * 3.0,
        seed: Math.random() * 1000
      });
    }

    /* 4. 50마리 나비 군집 로드 (Supabase 실제 나비 + 배경 나비떼) */
    async function initSwarm() {
      const { data } = await supabase
        .from('butterflies')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(30);

      const actualCount = data ? data.length : 0;
      if (data) {
        data.forEach(item => spawnButterfly(item));
      }

      // 화면에 최소 50마리가 가득 채워지도록 보강
      const needed = Math.max(0, 50 - actualCount);
      for (let i = 0; i < needed; i++) {
        spawnButterfly({
          name: '빛나비',
          wing_shape: shapes[i % shapes.length]
        });
      }
    }
    initSwarm();

    // 스마트폰에서 새 나비가 날아오면 실시간 스폰
    supabase
      .channel('public:butterflies')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'butterflies' }, (payload) => {
        spawnButterfly(payload.new, true);
      })
      .subscribe();

    /* 5. MediaPipe 웹캠 인터랙션 (손끝 빛 및 손동작 반응) */
    const videoElement = document.getElementById('webcam-video');
    const handPointer = document.getElementById('hand-pointer');

    let handTarget3D = new THREE.Vector3(999, 999, 0);
    let isHandDetected = false;

    function onResults(results) {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const indexTip = results.multiHandLandmarks[0][8];

        const screenX = (1 - indexTip.x) * window.innerWidth;
        const screenY = indexTip.y * window.innerHeight;

        handPointer.style.transform = `translate3d(${screenX}px, ${screenY}px, 0)`;
        handPointer.style.opacity = '1';

        const mappedX = ((1 - indexTip.x) - 0.5) * 24;
        const mappedY = -(indexTip.y - 0.5) * 14;
        handTarget3D.set(mappedX, mappedY, 0);
        isHandDetected = true;
      } else {
        handPointer.style.opacity = '0';
        handTarget3D.set(999, 999, 0);
        isHandDetected = false;
      }
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    hands.onResults(onResults);

    const cameraUtils = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });
    cameraUtils.start();

    /* 6. 나비떼 자유 비행 & 인터랙션 루프 */
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      butterflies.forEach((b) => {
        const flap = Math.sin(time * b.speed + b.seed) * 0.55;
        b.leftWing.rotation.y = flap;
        b.rightWing.rotation.y = -flap;

        b.group.position.x += Math.sin(time * 0.9 + b.seed) * 0.02 + b.velocity.x;
        b.group.position.y += Math.cos(time * 0.8 + b.seed) * 0.02 + b.velocity.y;
        b.group.position.z += Math.sin(time * 0.5 + b.seed) * 0.015 + b.velocity.z;

        // 손이 감지되면 손끝 빛무리를 향해 사르르 모여드는 군집 물리
        if (isHandDetected) {
          const distToHand = b.group.position.distanceTo(handTarget3D);
          if (distToHand < 8.0) {
            const dir = new THREE.Vector3().subVectors(handTarget3D, b.group.position).normalize();
            b.group.position.addScaledVector(dir, 0.055);
          }
        }

        // 화면 밖 경계 루프
        if (b.group.position.x > 14) b.group.position.x = -14;
        if (b.group.position.x < -14) b.group.position.x = 14;
        if (b.group.position.y > 9) b.group.position.y = -9;
        if (b.group.position.y < -9) b.group.position.y = 9;
        if (b.group.position.z > 6) b.group.position.z = -6;
        if (b.group.position.z < -6) b.group.position.z = 6;
      });

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
