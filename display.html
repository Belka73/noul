<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOUL : Luminous Space</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      user-select: none;
      cursor: none;
    }

    #webcam-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      filter: brightness(0.2) contrast(1.2) blur(3px);
      z-index: 0;
      pointer-events: none;
    }

    #three-canvas-container {
      position: absolute;
      inset: 0;
      z-index: 10;
    }

    #hand-pointer {
      position: absolute;
      width: 60px;
      height: 60px;
      margin-left: -30px;
      margin-top: -30px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.3) 45%, rgba(255, 255, 255, 0) 70%);
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.9), 0 0 70px rgba(255, 255, 255, 0.4);
      pointer-events: none;
      z-index: 30;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body>

  <video id="webcam-video" playsinline autoplay muted></video>
  <div id="three-canvas-container"></div>
  <div id="hand-pointer"></div>

  <script>
    const SUPABASE_URL = 'https://djmdzsbfsobsutphragw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqbWR6c2Jmc29ic3V0cGhyYWd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4ODQ3NTgsImV4cCI6MjEwNTQ2MDc1OH0.BC7llaSjbq6cYhDlRqrwJaycpQ6gSNcp5LgYBeM6WEM';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /* 나비 날개 지오메트리 */
    function createWingGeometry(isRight) {
      const shape = new THREE.Shape();
      const s = isRight ? 1 : -1;
      shape.moveTo(0, 0.48);
      shape.bezierCurveTo(s * 0.32, 0.88, s * 1.15, 1.78, s * 1.95, 1.72);
      shape.bezierCurveTo(s * 2.58, 1.68, s * 2.78, 1.18, s * 2.45, 0.62);
      shape.bezierCurveTo(s * 2.18, 0.22, s * 1.78, 0.02, s * 1.35, -0.08);
      shape.bezierCurveTo(s * 1.80, -0.35, s * 1.80, -1.08, s * 1.45, -1.52);
      shape.bezierCurveTo(s * 1.05, -1.92, s * 0.55, -1.82, s * 0.32, -1.48);
      shape.bezierCurveTo(s * 0.16, -1.15, s * 0.05, -0.72, 0, -0.48);
      shape.lineTo(0, 0.48);
      shape.closePath();

      const geom = new THREE.ShapeGeometry(shape, 28);
      const pos = geom.attributes.position;
      const uvs = [];
      const totalSpan = 5.4;
      for (let i = 0; i < pos.count; i++) {
        uvs.push(0.5 + (pos.getX(i) / totalSpan), 0.5 + (pos.getY(i) / totalSpan));
      }
      geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geom.computeVertexNormals();
      return geom;
    }

    /* 나비 몸통 */
    function createBodyGeometry() {
      const points = [
        new THREE.Vector2(0.001, 0.72),
        new THREE.Vector2(0.12, 0.62),
        new THREE.Vector2(0.085, 0.51),
        new THREE.Vector2(0.165, 0.28),
        new THREE.Vector2(0.105, 0.05),
        new THREE.Vector2(0.13, -0.15),
        new THREE.Vector2(0.11, -0.32),
        new THREE.Vector2(0.115, -0.42),
        new THREE.Vector2(0.07, -0.65),
        new THREE.Vector2(0.001, -0.82)
      ];
      return new THREE.LatheGeometry(points, 16);
    }

    /* 더듬이 */
    function createAntennaGroup(isRight, mat) {
      const group = new THREE.Group();
      const s = isRight ? 1 : -1;
      const curve = new THREE.CubicBezierCurve3(
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(s * 0.15, 0.45, 0.08),
        new THREE.Vector3(s * 0.42, 0.75, 0.14),
        new THREE.Vector3(s * 0.52, 0.98, 0.2)
      );
      group.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 16, 0.024, 6, false), mat));

      const tipMesh = new THREE.Mesh(new THREE.SphereGeometry(0.065, 8, 8), mat);
      tipMesh.position.set(s * 0.52, 0.98, 0.2);
      group.add(tipMesh);
      return group;
    }

    /* 발광 스프라이트 */
    function createGlowSprite(size, opacity) {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
      grad.addColorStop(0.3, 'rgba(255, 255, 255, 0.5)');
      grad.addColorStop(0.7, 'rgba(255, 255, 255, 0.1)');
      grad.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);

      const texture = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({
        map: texture,
        blending: THREE.AdditiveBlending,
        transparent: true,
        opacity: opacity,
        depthWrite: false
      });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(size, size, 1);
      return sprite;
    }

    /* Three.js 씬 구성 */
    const container = document.getElementById('three-canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 18);

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const textureLoader = new THREE.TextureLoader();
    const leftWingGeom = createWingGeometry(false);
    const rightWingGeom = createWingGeometry(true);
    const bodyGeom = createBodyGeometry();

    const defaultFlock = [];
    const userFlock = [];
    const MAX_USER_BUTTERFLIES = 30;

    function buildButterflyGroup(itemData = {}, isUser = false, isNew = false) {
      const group = new THREE.Group();
      let wingMat;

      if (isUser && itemData.texture_url && itemData.texture_url.startsWith('data:image')) {
        const tex = textureLoader.load(itemData.texture_url);
        wingMat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide });
      } else {
        wingMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
      }

      const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

      const leftWing = new THREE.Mesh(leftWingGeom, wingMat);
      const rightWing = new THREE.Mesh(rightWingGeom, wingMat);
      group.add(leftWing);
      group.add(rightWing);

      group.add(new THREE.Mesh(bodyGeom, whiteMat));

      const aL = createAntennaGroup(false, whiteMat);
      aL.position.set(-0.04, 0.58, 0.12);
      group.add(aL);

      const aR = createAntennaGroup(true, whiteMat);
      aR.position.set(0.04, 0.58, 0.12);
      group.add(aR);

      const glow = createGlowSprite(4.2, 0.45);
      glow.position.set(0, 0.1, -0.05);
      group.add(glow);

      if (isNew) {
        group.position.set(0, -9.0, 0);
      } else {
        group.position.set(
          (Math.random() - 0.5) * 18,
          (Math.random() - 0.5) * 11,
          (Math.random() - 0.5) * 6
        );
      }

      const s = 0.48 + Math.random() * 0.18;
      group.scale.set(s, s, s);
      scene.add(group);

      return {
        group,
        leftWing,
        rightWing,
        velocity: new THREE.Vector3((Math.random() - 0.5) * 0.03, (Math.random() - 0.5) * 0.03, (Math.random() - 0.5) * 0.015),
        speed: 4.5 + Math.random() * 2.5,
        seed: Math.random() * 1000
      };
    }

    function addUserButterfly(data, isNew = false) {
      if (userFlock.length >= MAX_USER_BUTTERFLIES) {
        const oldest = userFlock.shift();
        if (oldest && oldest.group) scene.remove(oldest.group);
      }
      userFlock.push(buildButterflyGroup(data, true, isNew));
    }

    /* 초기 20마리 순백 나비 생성 및 DB 연동 */
    for (let i = 0; i < 20; i++) {
      defaultFlock.push(buildButterflyGroup({}, false, false));
    }

    supabase
      .from('butterflies')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(MAX_USER_BUTTERFLIES)
      .then(({ data }) => {
        if (data && data.length > 0) {
          data.reverse().forEach(item => addUserButterfly(item, false));
        }
      });

    supabase
      .channel('public:butterflies')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'butterflies' }, (payload) => {
        addUserButterfly(payload.new, true);
      })
      .subscribe();

    /* MediaPipe 손끝 추적 */
    const videoElement = document.getElementById('webcam-video');
    const handPointer = document.getElementById('hand-pointer');
    let handTarget3D = new THREE.Vector3(999, 999, 0);
    let isHandDetected = false;

    function onResults(results) {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const tip = results.multiHandLandmarks[0][8];
        const screenX = (1 - tip.x) * window.innerWidth;
        const screenY = tip.y * window.innerHeight;

        handPointer.style.transform = `translate3d(${screenX}px, ${screenY}px, 0)`;
        handPointer.style.opacity = '1';

        handTarget3D.set(((1 - tip.x) - 0.5) * 20, -(tip.y - 0.5) * 12, 0);
        isHandDetected = true;
      } else {
        handPointer.style.opacity = '0';
        handTarget3D.set(999, 999, 0);
        isHandDetected = false;
      }
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    hands.onResults(onResults);

    const cameraUtils = new Camera(videoElement, {
      onFrame: async () => { await hands.send({ image: videoElement }); },
      width: 640,
      height: 480
    });
    cameraUtils.start();

    /* 애니메이션 및 비행 물리 루프 */
    const clock = new THREE.Clock();

    function updateMotion(b, time) {
      const flap = Math.sin(time * b.speed + b.seed) * 0.55;
      b.leftWing.rotation.y = flap;
      b.rightWing.rotation.y = -flap;

      b.group.position.x += Math.sin(time * 0.8 + b.seed) * 0.02 + b.velocity.x;
      b.group.position.y += Math.cos(time * 0.9 + b.seed) * 0.02 + b.velocity.y;
      b.group.position.z += Math.sin(time * 0.6 + b.seed) * 0.015 + b.velocity.z;

      if (isHandDetected) {
        const dist = b.group.position.distanceTo(handTarget3D);
        if (dist < 8.0) {
          const dir = new THREE.Vector3().subVectors(handTarget3D, b.group.position).normalize();
          b.group.position.addScaledVector(dir, 0.05);
        }
      }

      if (b.group.position.x > 11) b.group.position.x = -11;
      if (b.group.position.x < -11) b.group.position.x = 11;
      if (b.group.position.y > 7) b.group.position.y = -7;
      if (b.group.position.y < -7) b.group.position.y = 7;
      if (b.group.position.z > 4) b.group.position.z = -4;
      if (b.group.position.z < -4) b.group.position.z = 4;
    }

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();
      defaultFlock.forEach(b => updateMotion(b, time));
      userFlock.forEach(b => updateMotion(b, time));
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
