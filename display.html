<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOUL : Luminous Space</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: #000000; user-select: none; cursor: none;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard Variable", Pretendard, sans-serif;
    }
    #webcam-video {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; transform: scaleX(-1) translateZ(0);
      z-index: 0; pointer-events: none;
      opacity: 0.28;
      will-change: transform;
    }
    #video-dark-overlay {
      position: absolute; inset: 0;
      background: #000000;
      opacity: 0.65;
      z-index: 1; pointer-events: none;
    }
    #three-canvas-container {
      position: absolute; inset: 0; z-index: 10;
      transform: translateZ(0);
      will-change: transform;
    }

    #hand-pointer {
      position: absolute; 
      top: 0; left: 0;
      width: 52px; height: 52px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      pointer-events: none; z-index: 30; opacity: 0; 
      transition: opacity 0.2s ease;
      will-change: transform, opacity;
      contain: layout style;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #hand-pointer::after {
      content: '';
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    /* 1단계: 고민 안내 카드 */
    #floating-concern-card {
      position: absolute;
      top: 0; left: 0;
      width: 240px;
      min-height: 120px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
      z-index: 42;
      opacity: 0;
      transition: opacity 0.35s ease;
      will-change: transform, opacity;
      contain: layout style;
      backface-visibility: hidden;
    }

    #floating-concern-card::before {
      content: '';
      position: absolute;
      inset: -45px;
      background: radial-gradient(ellipse 60% 55% at 50% 50%, 
        rgba(10, 10, 14, 0.98) 0%, 
        rgba(10, 10, 14, 0.92) 25%, 
        rgba(10, 10, 14, 0.70) 45%, 
        rgba(10, 10, 14, 0.35) 65%, 
        rgba(10, 10, 14, 0.10) 82%, 
        rgba(0, 0, 0, 0) 100%);
      z-index: -1;
      border-radius: 50%;
    }

    #floating-concern-card.visible {
      opacity: 1;
    }

    .concern-badge-tag {
      display: inline-block;
      color: #ffffff;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
      z-index: 2;
    }

    #floating-concern-reason {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.5;
      color: #f0f0f5;
      word-break: keep-all;
      z-index: 2;
      min-height: 34px;
    }

    /* 2단계: 다정한 한마디 카드 */
    #floating-info-card {
      position: absolute;
      top: 0; left: 0;
      width: 240px;
      min-height: 120px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
      z-index: 40;
      opacity: 0;
      transition: opacity 0.35s ease;
      will-change: transform, opacity;
      contain: layout style;
      backface-visibility: hidden;
    }
    #floating-info-card::before {
      content: '';
      position: absolute;
      inset: -45px;
      background: radial-gradient(ellipse 60% 55% at 50% 50%, 
        rgba(255, 255, 255, 0.98) 0%, 
        rgba(255, 255, 255, 0.90) 25%, 
        rgba(255, 255, 255, 0.65) 45%, 
        rgba(255, 255, 255, 0.30) 65%, 
        rgba(255, 255, 255, 0.08) 82%, 
        rgba(255, 255, 255, 0) 100%);
      z-index: -1;
      border-radius: 50%;
    }
    #floating-info-card.visible {
      opacity: 1;
    }

    #floating-butterfly-name {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #08080a;
      margin-bottom: 5px;
      z-index: 2;
      text-align: center;
    }

    #floating-butterfly-memo {
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.45;
      color: #1a1a20;
      word-break: keep-all;
      z-index: 2;
      min-height: 34px;
      text-align: center;
    }

    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      vertical-align: middle;
      background-color: currentColor;
      margin-left: 2px;
      animation: cursorBlink 0.75s infinite;
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    #gesture-guide-banner {
      position: absolute;
      bottom: 2.2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.8rem;
      padding: 0.5rem 1.0rem;
      background: transparent !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      white-space: nowrap;
      will-change: transform;
    }

    .guide-banner-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 13.5px;
      color: #e5e5ea;
      letter-spacing: -0.2px;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
    }
    .guide-banner-item strong {
      color: #ffffff;
      font-weight: 700;
    }
    .guide-banner-divider {
      width: 1px;
      height: 13px;
      background: rgba(255, 255, 255, 0.28);
    }
  </style>
</head>
<body>

  <video id="webcam-video" playsinline autoplay muted></video>
  <div id="video-dark-overlay"></div>
  <div id="three-canvas-container"></div>
  <div id="hand-pointer"></div>

  <!-- 1단계: 고민 안내 카드 -->
  <div id="floating-concern-card">
    <div id="floating-concern-tag" class="concern-badge-tag">#완벽주의 강박</div>
    <div id="floating-concern-reason"></div>
  </div>

  <!-- 2단계: 다정한 한마디 카드 -->
  <div id="floating-info-card">
    <div id="floating-butterfly-name">‘나비’</div>
    <div id="floating-butterfly-memo"></div>
  </div>

  <!-- 하단 안내 배너 -->
  <aside id="gesture-guide-banner">
    <div class="guide-banner-item">
      <span>👉</span>
      <span><strong>손가락 하나</strong> 나비가 손끝에 내려앉아요. 나비와 함께 교감해 보세요.</span>
    </div>
    <div class="guide-banner-divider"></div>
    <div class="guide-banner-item">
      <span>✊</span>
      <span><strong>주먹을 쥐면</strong> 나비들이 곁으로 모여들어요.</span>
    </div>
    <div class="guide-banner-divider"></div>
    <div class="guide-banner-item">
      <span>🖐️</span>
      <span><strong>손을 펼치면</strong> 나비들이 흩어져 날아가요.</span>
    </div>
  </aside>

  <script>
    /* ========================================================
       1. Three.js 설정 및 최적화 재질/지오메트리 구축
       ======================================================== */
    const BUTTERFLY_SHAPES = [
      'crescent',
      'dawn-ray',
      'ember',
      'moon-halo',
      'petal',
      'starlight',
      'wave-fin'
    ];

    const DEFAULT_BUTTERFLY_SHAPES = ['crescent', 'moon-halo'];

    const sharedWhiteMat = new THREE.MeshBasicMaterial({ 
      color: 0xffffff, 
      side: THREE.DoubleSide, 
      transparent: false, 
      depthWrite: true 
    });

    function createStableWingGeom(isRight) {
      const shape = new THREE.Shape();
      const s = isRight ? 1 : -1;
      shape.moveTo(0, 0.5);
      shape.bezierCurveTo(s * 0.4, 1.0, s * 1.5, 2.0, s * 2.4, 1.8);
      shape.bezierCurveTo(s * 3.0, 1.6, s * 2.8, 0.8, s * 2.2, 0.2);
      shape.bezierCurveTo(s * 2.5, -0.4, s * 2.2, -1.5, s * 1.6, -1.8);
      shape.bezierCurveTo(s * 1.0, -2.0, s * 0.4, -1.6, s * 0.2, -1.0);
      shape.bezierCurveTo(s * 0.1, -0.6, s * 0.05, -0.2, 0, -0.5);
      shape.lineTo(0, 0.5);

      const geom = new THREE.ShapeGeometry(shape, 6);
      geom.computeVertexNormals();
      geom.computeBoundingBox();
      const bb = geom.boundingBox;
      const sizeX = bb.max.x - bb.min.x || 1;
      const sizeY = bb.max.y - bb.min.y || 1;
      const pos = geom.attributes.position;
      const uvs = [];

      for (let i = 0; i < pos.count; i++) {
        uvs.push((pos.getX(i) - bb.min.x) / sizeX, (pos.getY(i) - bb.min.y) / sizeY);
      }
      geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      return geom;
    }

    function createBodyGeom() {
      const points = [
        new THREE.Vector2(0.001, 0.8), new THREE.Vector2(0.14, 0.7),
        new THREE.Vector2(0.10, 0.5), new THREE.Vector2(0.18, 0.3),
        new THREE.Vector2(0.12, 0.0), new THREE.Vector2(0.15, -0.2),
        new THREE.Vector2(0.12, -0.4), new THREE.Vector2(0.08, -0.7),
        new THREE.Vector2(0.001, -0.9)
      ];
      return new THREE.LatheGeometry(points, 5);
    }

    function createAntenna(isRight, mat) {
      const group = new THREE.Group();
      const s = isRight ? 1 : -1;
      const curve = new THREE.CubicBezierCurve3(
        new THREE.Vector3(0, 0, 0), new THREE.Vector3(s * 0.2, 0.5, 0.1),
        new THREE.Vector3(s * 0.5, 0.9, 0.2), new THREE.Vector3(s * 0.65, 1.2, 0.3)
      );
      const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 5, 0.035, 3, false), mat);
      group.add(tube);
      const tip = new THREE.Mesh(new THREE.SphereGeometry(0.09, 4, 4), mat);
      tip.position.set(s * 0.65, 1.2, 0.3);
      group.add(tip);
      return group;
    }

    const textureCache = {};
    function createStandardWingMaterial(textureURL) {
      let photoTex = textureCache[textureURL];
      if (!photoTex) {
        photoTex = textureLoader.load(textureURL);
        photoTex.flipY = false;
        photoTex.generateMipmaps = false;
        photoTex.minFilter = THREE.LinearFilter;
        if (THREE.sRGBEncoding) photoTex.encoding = THREE.sRGBEncoding;
        textureCache[textureURL] = photoTex;
      }

      return new THREE.MeshBasicMaterial({
        map: photoTex,
        side: THREE.DoubleSide,
        transparent: false,
        depthWrite: true
      });
    }

    function applyProjectedUVsToGeometry(geometry) {
      if (!geometry || !geometry.attributes || !geometry.attributes.position) return;
      const pos = geometry.attributes.position;
      const uvs = new Float32Array(pos.count * 2);

      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        const u = Math.max(0.0, Math.min(1.0, (x + 2.4) / 4.8));
        const v = Math.max(0.0, Math.min(1.0, 1.0 - (y + 2.4) / 4.8));
        uvs[i * 2 + 0] = u;
        uvs[i * 2 + 1] = v;
      }
      geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
      geometry.attributes.uv.needsUpdate = true;
    }

    const modelCache = {};
    const modelLoadingPromises = {};
    let resolvedBasePath = null;

    const candidateBases = [
      '3DButterfly/',
      './3DButterfly/',
      '../3DButterfly/'
    ];

    function getOrLoadModel(modelName) {
      if (modelCache[modelName]) {
        return Promise.resolve(modelCache[modelName]);
      }
      if (modelLoadingPromises[modelName]) {
        return modelLoadingPromises[modelName];
      }

      const bases = resolvedBasePath ? [resolvedBasePath] : candidateBases;

      modelLoadingPromises[modelName] = new Promise((resolve) => {
        let idx = 0;
        function tryNext() {
          if (idx >= bases.length) {
            resolve(null);
            return;
          }
          const base = bases[idx++];
          const fullPath = base + modelName + '.glb';

          gltfLoader.load(
            fullPath,
            (gltf) => {
              resolvedBasePath = base;
              modelCache[modelName] = gltf.scene;
              resolve(gltf.scene);
            },
            undefined,
            () => {
              tryNext();
            }
          );
        }
        tryNext();
      });

      return modelLoadingPromises[modelName];
    }

    const container = document.getElementById('three-canvas-container');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 14.5);

    const renderer = new THREE.WebGLRenderer({ 
      alpha: true, 
      antialias: false, 
      powerPreference: "high-performance",
      precision: "mediump",
      stencil: false,
      depth: true
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(1.0);
    if (THREE.sRGBEncoding) {
      renderer.outputEncoding = THREE.sRGBEncoding;
    }
    container.appendChild(renderer.domElement);

    const ambLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(0, 5, 10);
    scene.add(dirLight);

    const textureLoader = new THREE.TextureLoader();
    const gltfLoader = new THREE.GLTFLoader();
    const leftGeom = createStableWingGeom(false);
    const rightGeom = createStableWingGeom(true);
    const bodyGeom = createBodyGeom();

    function disposeButterfly(b) {
      if (!b || !b.group) return;
      scene.remove(b.group);
      b.group.traverse((child) => {
        if (child.isMesh) {
          if (child.geometry && child.geometry !== leftGeom && child.geometry !== rightGeom && child.geometry !== bodyGeom) {
            child.geometry.dispose();
          }
          if (child.material && child.material !== sharedWhiteMat) {
            if (child.material.map && !Object.values(textureCache).includes(child.material.map)) {
              child.material.map.dispose();
            }
            child.material.dispose();
          }
        }
      });
    }

    /* ========================================================
       🌟 팅커벨 별가루 파티클 공통 텍스처 (사진과 100% 동일한 은은한 미세 점)
       ======================================================== */
    const dustCanvas = document.createElement('canvas');
    dustCanvas.width = 16; dustCanvas.height = 16;
    const dustCtx = dustCanvas.getContext('2d');
    const dustGrad = dustCtx.createRadialGradient(8, 8, 0, 8, 8, 8);
    dustGrad.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
    dustGrad.addColorStop(0.35, 'rgba(255, 255, 255, 0.45)');
    dustGrad.addColorStop(0.75, 'rgba(255, 255, 255, 0.12)');
    dustGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
    dustCtx.fillStyle = dustGrad;
    dustCtx.fillRect(0, 0, 16, 16);
    const dustTexture = new THREE.CanvasTexture(dustCanvas);
    dustTexture.needsUpdate = true;

    /* ========================================================
       1) 세레머니 나비용 파티클 시스템 (초미세 상승 별가루)
       ======================================================== */
    const CEREMONY_PARTICLES = 120;
    const ceremonyParticlePositions = new Float32Array(CEREMONY_PARTICLES * 3);
    const ceremonyParticleData = [];

    for (let i = 0; i < CEREMONY_PARTICLES; i++) {
      ceremonyParticleData.push({ x: 9999, y: 9999, z: 9999, vx: 0, vy: 0, vz: 0, life: 0 });
      ceremonyParticlePositions[i * 3 + 0] = 9999;
      ceremonyParticlePositions[i * 3 + 1] = 9999;
      ceremonyParticlePositions[i * 3 + 2] = 9999;
    }

    const ceremonyParticleGeom = new THREE.BufferGeometry();
    ceremonyParticleGeom.setAttribute('position', new THREE.BufferAttribute(ceremonyParticlePositions, 3));

    // 🌟 [수정 반영] size를 0.018로 대폭 축소하여 화면 2~3px 별가루로 일치
    const ceremonyParticleMat = new THREE.PointsMaterial({
      map: dustTexture,
      size: 0.018,
      transparent: true,
      opacity: 0.75,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      color: 0xffffff
    });
    const ceremonyParticlePoints = new THREE.Points(ceremonyParticleGeom, ceremonyParticleMat);
    ceremonyParticlePoints.frustumCulled = false;
    scene.add(ceremonyParticlePoints);

    let ceremonyParticleCursor = 0;
    // 🌟 [수정 반영] 나비 아래쪽에서 생성되어 위로 솔솔 피어오르는 팅커벨 가루
    function spawnCeremonyParticle(pos) {
      const p = ceremonyParticleData[ceremonyParticleCursor];
      p.x = pos.x + (Math.random() - 0.5) * 0.85;
      p.y = pos.y - 0.35 - Math.random() * 0.35; // 나비 아래쪽
      p.z = (pos.z || 8.0) + (Math.random() - 0.5) * 0.3;
      p.vx = (Math.random() - 0.5) * 0.012;
      p.vy = 0.020 + Math.random() * 0.025; // 위쪽으로 상승!
      p.vz = (Math.random() - 0.5) * 0.010;
      p.life = 0.85 + Math.random() * 0.35;
      ceremonyParticleCursor = (ceremonyParticleCursor + 1) % CEREMONY_PARTICLES;
    }

    function updateCeremonyParticles(dt) {
      let needsUpdate = false;
      const posAttr = ceremonyParticleGeom.attributes.position;
      for (let i = 0; i < CEREMONY_PARTICLES; i++) {
        const p = ceremonyParticleData[i];
        if (p.life > 0) {
          p.life -= dt;
          p.x += p.vx;
          p.y += p.vy; // 위로 피어오름
          p.z += p.vz;
          posAttr.setXYZ(i, p.x, p.y, p.z);
          needsUpdate = true;
        } else if (p.x !== 9999) {
          p.x = 9999;
          posAttr.setXYZ(i, 9999, 9999, 9999);
          needsUpdate = true;
        }
      }
      if (needsUpdate) posAttr.needsUpdate = true;
    }

    /* ========================================================
       2) 손가락 나비용 파티클 시스템 (초미세 상승 별가루)
       ======================================================== */
    const ENERGY_PARTICLES_COUNT = 150;
    const energyParticlePositions = new Float32Array(ENERGY_PARTICLES_COUNT * 3);
    const energyParticleData = [];

    for (let i = 0; i < ENERGY_PARTICLES_COUNT; i++) {
      energyParticleData.push({ x: 9999, y: 9999, z: 9999, vx: 0, vy: 0, vz: 0, life: 0 });
      energyParticlePositions[i * 3 + 0] = 9999;
      energyParticlePositions[i * 3 + 1] = 9999;
      energyParticlePositions[i * 3 + 2] = 9999;
    }

    const energyParticleGeom = new THREE.BufferGeometry();
    energyParticleGeom.setAttribute('position', new THREE.BufferAttribute(energyParticlePositions, 3));

    // 🌟 [수정 반영] size를 0.018로 대폭 축소하여 화면 2~3px 별가루로 일치
    const energyParticleMat = new THREE.PointsMaterial({
      map: dustTexture,
      size: 0.018,
      transparent: true,
      opacity: 0.75,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      color: 0xffffff
    });
    const energyParticlePoints = new THREE.Points(energyParticleGeom, energyParticleMat);
    energyParticlePoints.frustumCulled = false;
    scene.add(energyParticlePoints);

    let energyParticleCursor = 0;
    // 🌟 [수정 반영] 나비 아래쪽에서 생성되어 위로 솔솔 피어오르는 팅커벨 가루
    function spawnEnergyParticle(pos) {
      const p = energyParticleData[energyParticleCursor];
      p.x = pos.x + (Math.random() - 0.5) * 0.85;
      p.y = pos.y - 0.35 - Math.random() * 0.35; // 나비 아래쪽
      p.z = (pos.z || 8.0) + (Math.random() - 0.5) * 0.3;
      p.vx = (Math.random() - 0.5) * 0.012;
      p.vy = 0.020 + Math.random() * 0.025; // 위쪽으로 상승!
      p.vz = (Math.random() - 0.5) * 0.010;
      p.life = 0.85 + Math.random() * 0.35;
      energyParticleCursor = (energyParticleCursor + 1) % ENERGY_PARTICLES_COUNT;
    }

    function updateEnergyParticles(dt) {
      let needsUpdate = false;
      const posAttr = energyParticleGeom.attributes.position;
      for (let i = 0; i < ENERGY_PARTICLES_COUNT; i++) {
        const p = energyParticleData[i];
        if (p.life > 0) {
          p.life -= dt;
          p.x += p.vx;
          p.y += p.vy; // 위로 피어오름
          p.z += p.vz;
          posAttr.setXYZ(i, p.x, p.y, p.z);
          needsUpdate = true;
        } else if (p.x !== 9999) {
          p.x = 9999;
          posAttr.setXYZ(i, 9999, 9999, 9999);
          needsUpdate = true;
        }
      }
      if (needsUpdate) posAttr.needsUpdate = true;
    }

    const defaultFlock = [];
    const userFlock = [];
    const MAX_USER_BUTTERFLIES = 8;
    const rawUserDataList = [];

    function buildButterfly(data = {}, isUser = false, isDelayedArrival = false, isFingerTarget = false, customZ = 8.0, isCeremony = false) {
      const group = new THREE.Group();
      const innerGroup = new THREE.Group(); 
      
      let leftWing = new THREE.Mesh(leftGeom, sharedWhiteMat);
      let rightWing = new THREE.Mesh(rightGeom, sharedWhiteMat);
      const defaultBody = new THREE.Mesh(bodyGeom, sharedWhiteMat);

      innerGroup.add(leftWing);
      innerGroup.add(rightWing);
      innerGroup.add(defaultBody);
      
      const aL = createAntenna(false, sharedWhiteMat); aL.position.set(-0.05, 0.7, 0.15); innerGroup.add(aL);
      const aR = createAntenna(true, sharedWhiteMat); aR.position.set(0.05, 0.7, 0.15); innerGroup.add(aR);

      innerGroup.rotation.set(isCeremony ? 0 : Math.PI / 2, isCeremony ? 0 : Math.PI, 0);
      group.add(innerGroup);

      const shapeId = data.wing_shape || DEFAULT_BUTTERFLY_SHAPES[Math.floor(Math.random() * DEFAULT_BUTTERFLY_SHAPES.length)];
      const antId = data.antenna_type || 'ball';
      const targetAntennaPrefix = 'Antenna_' + antId;

      const textureURL = data.texture_url || data.image_url;
      const hasTexture = !!(isUser && textureURL);

      const wingMat = hasTexture ? createStandardWingMaterial(textureURL) : sharedWhiteMat;

      if (gltfLoader) {
        getOrLoadModel(shapeId).then((sceneTemplate) => {
          if (!sceneTemplate) return;
          const model = sceneTemplate.clone(true);
          let newWingL = null, newWingR = null;
          const meshesToRemove = [];

          model.traverse(function(child) {
            if (child.isMesh) {
              const name = child.name || '';
              if (name.startsWith('Wing_L')) { 
                newWingL = child; 
                newWingL.userData.baseRotY = child.rotation.y;
                if (hasTexture) {
                  child.geometry = child.geometry.clone();
                  applyProjectedUVsToGeometry(child.geometry);
                }
                child.material = wingMat; 
              }
              else if (name.startsWith('Wing_R')) { 
                newWingR = child; 
                newWingR.userData.baseRotY = child.rotation.y;
                if (hasTexture) {
                  child.geometry = child.geometry.clone();
                  applyProjectedUVsToGeometry(child.geometry);
                }
                child.material = wingMat; 
              }
              else if (name.startsWith('Body')) { 
                child.material = sharedWhiteMat; 
              }
              else if (name.startsWith('Antenna_')) { 
                if (name.startsWith(targetAntennaPrefix)) {
                  child.material = sharedWhiteMat;
                } else {
                  meshesToRemove.push(child);
                }
              }
            }
          });

          meshesToRemove.forEach((m) => {
            if (m.parent) m.parent.remove(m);
          });

          if (newWingL && newWingR) {
            innerGroup.remove(leftWing);
            innerGroup.remove(rightWing);
            innerGroup.remove(defaultBody);
            innerGroup.remove(aL);
            innerGroup.remove(aR);
            model.scale.set(0.95, 0.95, 0.95);
            innerGroup.add(model);
            butterflyRecord.leftWing = newWingL;
            butterflyRecord.rightWing = newWingR;
          }
        });
      }

      let initialVelocity;
      let targetScale = 0.62 + Math.random() * 0.14;

      const targetBPM = 120;
      const flapSpeed = (targetBPM / 60) * 2 * Math.PI * 2;
      const initialSpeed = 0.110 + Math.random() * 0.025;

      let initScreenAngle = Math.random() * Math.PI * 2;
      let initDepthAngle = (Math.random() - 0.5) * 0.35;

      if (isCeremony) {
        group.position.set(0, -7.5, 8.0);
        initialVelocity = new THREE.Vector3(0, 0.034, 0);
        targetScale = 0.65;
        group.scale.set(0.65, 0.65, 0.65);
        group.rotation.set(0, 0, 0);
        initScreenAngle = Math.PI / 2;
      } else if (isFingerTarget) {
        group.position.set(-14.0, 8.5, 8.0);
        initialVelocity = new THREE.Vector3(0.06, -0.04, 0);
        initScreenAngle = -Math.PI / 6;
        targetScale = 0.58;
        group.scale.set(0.58, 0.58, 0.58);
      } else if (isDelayedArrival) {
        const fromTop = Math.random() < 0.5;
        group.position.set((Math.random() - 0.5) * 10, fromTop ? 8.0 : -7.5, 1.5);
        initialVelocity = new THREE.Vector3(0.04, fromTop ? -0.09 : 0.09, -0.01);
        initScreenAngle = fromTop ? -Math.PI / 2 : Math.PI / 2;
        group.scale.set(0.01, 0.01, 0.01);
      } else {
        const spawnMode = Math.floor(Math.random() * 5);
        let spawnX = 0, spawnY = 0;

        if (spawnMode === 0) {
          spawnX = (Math.random() - 0.5) * 18;
          spawnY = 6.8 + Math.random() * 1.5;
          initScreenAngle = -Math.PI / 2 + (Math.random() - 0.5) * 1.2;
        } else if (spawnMode === 1) {
          spawnX = (Math.random() - 0.5) * 18;
          spawnY = -6.8 - Math.random() * 1.5;
          initScreenAngle = Math.PI / 2 + (Math.random() - 0.5) * 1.2;
        } else if (spawnMode === 2) {
          spawnX = -13.5 - Math.random() * 2.0;
          spawnY = (Math.random() - 0.5) * 10;
          initScreenAngle = 0 + (Math.random() - 0.5) * 1.2;
        } else if (spawnMode === 3) {
          spawnX = 13.5 + Math.random() * 2.0;
          spawnY = (Math.random() - 0.5) * 10;
          initScreenAngle = Math.PI + (Math.random() - 0.5) * 1.2;
        } else {
          spawnX = (Math.random() - 0.5) * 16;
          spawnY = (Math.random() - 0.5) * 8.5;
          initScreenAngle = Math.random() * Math.PI * 2;
        }

        group.position.set(spawnX, spawnY, -0.5 - Math.random() * 5.0);

        const cosD = Math.cos(initDepthAngle);
        initialVelocity = new THREE.Vector3(
          cosD * Math.cos(initScreenAngle) * initialSpeed,
          cosD * Math.sin(initScreenAngle) * initialSpeed,
          Math.sin(initDepthAngle) * initialSpeed
        );
        group.scale.set(targetScale, targetScale, targetScale);
      }

      scene.add(group);

      const butterflyRecord = {
        id: Math.random().toString(36).substring(7),
        group, innerGroup, leftWing, rightWing,
        velocity: initialVelocity,
        speed: flapSpeed,
        seed: Math.random() * 1000,
        wingPhase: Math.random() * Math.PI * 2,
        flapAmp: 1.0, 
        state: 'flying',
        targetScale: targetScale,
        isAscendingArrival: isDelayedArrival,
        arrivalTimer: 0,
        isSpecialLanding: isFingerTarget,
        specialState: isFingerTarget ? 'approaching' : null,
        isCeremony: isCeremony,
        ceremonyStage: isCeremony ? 'rising' : null,
        ceremonyRestTimer: 0,
        takeoffTimer: 0,
        name: data.name || (isUser ? "익명의 나비" : "나비"),
        memo: data.memo || "너의 찬란한 날갯짓을 응원해.",
        core_concern: data.core_concern || (Array.isArray(data.q2) && data.q2.length > 0 ? data.q2[0] : "완벽주의 강박"),
        concern_reason: data.concern_reason || "항상 잘 해내야 한다는 마음이 앞서서요.",
        screenAngle: initScreenAngle,
        depthAngle: initDepthAngle,
        speedBase: initialSpeed,
        turnRateAngle: 0,
        turnRateDepth: 0,
        angleBias: (Math.random() - 0.5) * 0.035,
        rollBias: (Math.random() - 0.5) * 0.10,
        dirChangeTimer: Math.random() * 3.0,
        strokePower: 0,
        prevBobY: 0
      };

      return butterflyRecord;
    }

    for (let i = 0; i < 8; i++) {
      const assignedShape = DEFAULT_BUTTERFLY_SHAPES[i % DEFAULT_BUTTERFLY_SHAPES.length];
      defaultFlock.push(buildButterfly({ wing_shape: assignedShape, antenna_type: 'ball' }, false, false, false));
    }

    const clock = new THREE.Clock();
    const dummyObj = new THREE.Object3D(); 
    
    const _vDir = new THREE.Vector3();
    const _vTargetPos = new THREE.Vector3();
    const _vOrbit = new THREE.Vector3();
    const _vLeave = new THREE.Vector3(18.0, 10.5, 8.0);
    const _vStep = new THREE.Vector3();
    const _handUnprojectVec = new THREE.Vector3();

    let handTarget3D = new THREE.Vector3(999, 999, 8.0);
    let targetHandPos3D = new THREE.Vector3(999, 999, 8.0);
    let prevHandTarget3D = new THREE.Vector3(999, 999, 8.0);
    let isHandDetected = false;
    let interactionMode = 'none';
    
    let specialButterfly = null;
    let fistButterflies = []; 
    let isCreatingSpecialButterfly = false;
    let landOneGestureTimer = null;

    const floatingConcernCard = document.getElementById('floating-concern-card');
    const floatingConcernTag = document.getElementById('floating-concern-tag');
    const floatingConcernReason = document.getElementById('floating-concern-reason');

    const floatingInfoCard = document.getElementById('floating-info-card');
    const floatingName = document.getElementById('floating-butterfly-name');
    const floatingMemo = document.getElementById('floating-butterfly-memo');

    let landingStorySequenceTimer = null;
    let activeTypingTimeout = null;

    let activeCeremonyButterfly = null;
    let ceremonyCardTimer = null;

    function typeWriterText(targetElement, fullText, speed = 45, callback = null) {
      if (activeTypingTimeout) clearTimeout(activeTypingTimeout);
      targetElement.innerHTML = '';
      let index = 0;
      function step() {
        if (index <= fullText.length) {
          const currentSub = fullText.substring(0, index);
          const isDone = index === fullText.length;
          targetElement.innerHTML = `${currentSub}${isDone ? '' : '<span class="typing-cursor"></span>'}`;
          index++;
          if (!isDone) {
            activeTypingTimeout = setTimeout(step, speed);
          } else if (callback) {
            callback();
          }
        }
      }
      step();
    }

    function resetHandCards() {
      clearTimeout(landingStorySequenceTimer);
      if (floatingConcernCard) floatingConcernCard.classList.remove('visible');
      if (floatingConcernReason) floatingConcernReason.innerHTML = '';
      
      if (!activeCeremonyButterfly) {
        if (activeTypingTimeout) clearTimeout(activeTypingTimeout);
        if (floatingInfoCard) floatingInfoCard.classList.remove('visible');
        if (floatingMemo) floatingMemo.innerHTML = '';
      }
    }

    function triggerLandingStorySequence(b) {
      resetHandCards();
      if (floatingConcernCard) {
        floatingConcernTag.innerText = `#${b.core_concern}`;
        floatingConcernCard.classList.add('visible');
        const fullReason = `"${b.concern_reason}"`;
        setTimeout(() => { typeWriterText(floatingConcernReason, fullReason, 45); }, 150);
      }

      landingStorySequenceTimer = setTimeout(() => {
        if (floatingConcernCard) floatingConcernCard.classList.remove('visible');
        if (floatingInfoCard && !activeCeremonyButterfly) {
          floatingName.innerText = `‘${b.name}’`;
          floatingInfoCard.classList.add('visible');
          const fullMemo = `"${b.memo}"`;
          setTimeout(() => { typeWriterText(floatingMemo, fullMemo, 45); }, 150);
        }
      }, 4200);
    }

    function triggerCeremonyCardSequence(b) {
      clearTimeout(ceremonyCardTimer);
      if (activeTypingTimeout) clearTimeout(activeTypingTimeout);

      // 나비의 3D 월드 Y좌표를 화면 2D Y좌표로 정확히 투영
      const bPos = new THREE.Vector3(0, b.group.position.y, b.group.position.z);
      bPos.project(camera);
      const screenCY = (-(bPos.y) * 0.5 + 0.5) * window.innerHeight;

      // 나비 아래쪽에 알맞은 간격으로 수직 정렬
      const cardTop = screenCY + (window.innerHeight * 0.135);

      // CSS 엔진의 -50%를 적용하여 화면 정중앙 수직선에 1px 오차 없이 완벽 정렬
      floatingInfoCard.style.left = '50%';
      floatingInfoCard.style.transform = `translate3d(-50%, ${cardTop}px, 0)`;
      floatingName.innerText = `‘${b.name}’`;
      floatingInfoCard.classList.add('visible');

      const fullMemo = `"${b.memo}"`;
      typeWriterText(floatingMemo, fullMemo, 45, () => {
        ceremonyCardTimer = setTimeout(() => {
          if (floatingInfoCard) floatingInfoCard.classList.remove('visible');
          
          setTimeout(() => {
            if (b && b.isCeremony && b.ceremonyStage === 'resting') {
              b.ceremonyStage = 'flying_up';
              b.takeoffTimer = 0;
              b.state = 'flying';
              b.velocity.set(0, 0.009, 0);
            }
          }, 1000);
        }, 5000);
      });
    }

    let currentScreenX = 0, currentScreenY = 0;
    let targetScreenX = 0, targetScreenY = 0;
    const handPointer = document.getElementById('hand-pointer');

    /* ========================================================
       이동 및 날개짓 물리 연산 (상하/대각선 360도 전방위 유영 엔진)
       ======================================================== */
    function updateMotion(b, dt, time) {
      let currentTargetScale = b.targetScale;

      if (b.isSpecialLanding || b.isCeremony) {
        b.group.scale.set(b.targetScale, b.targetScale, b.targetScale);
      } else if (b.isAscendingArrival) {
        b.arrivalTimer += dt;
        b.group.scale.set(
          b.group.scale.x + (b.targetScale - b.group.scale.x) * 0.04,
          b.group.scale.y + (b.targetScale - b.group.scale.y) * 0.04,
          b.group.scale.z + (b.targetScale - b.group.scale.z) * 0.04
        );
        b.velocity.y *= 0.99;
        if (b.arrivalTimer > 5.5 || b.group.position.y > 0) b.isAscendingArrival = false; 
      } else {
        b.group.scale.set(
          b.group.scale.x + (currentTargetScale - b.group.scale.x) * 0.1,
          b.group.scale.y + (currentTargetScale - b.group.scale.y) * 0.1,
          b.group.scale.z + (currentTargetScale - b.group.scale.z) * 0.1
        );
      }

      const baseRotL = (b.leftWing.userData && b.leftWing.userData.baseRotY) || 0;
      const baseRotR = (b.rightWing.userData && b.rightWing.userData.baseRotY) || 0;

      if (b.wingPhase === undefined) b.wingPhase = b.seed || 0;

      let currentFlapSpeed = b.speed;
      if (b.isSpecialLanding && b.specialState === 'approaching') {
        currentFlapSpeed = b.speed * 1.05;
      } else if (b.isCeremony) {
        if (b.ceremonyStage === 'rising') {
          const dy = Math.max(0, 0.3 - b.group.position.y);
          const speedFactor = Math.min(1.0, Math.max(0.35, dy / 2.0));
          currentFlapSpeed = b.speed * 0.92 * speedFactor;
        } else if (b.ceremonyStage === 'resting') {
          const restTime = b.ceremonyRestTimer || 0;
          const settleProgress = Math.min(1.0, restTime / 2.2);
          currentFlapSpeed = b.speed * 0.92 * 0.35 * (1.0 - settleProgress);
        } else if (b.ceremonyStage === 'flying_up') {
          const takeoffProg = Math.min(1.0, (b.takeoffTimer || 0) / 2.8);
          currentFlapSpeed = b.speed * (0.40 + 1.05 * Math.pow(takeoffProg, 1.3));
        } else {
          currentFlapSpeed = b.speed;
        }
      } else if (b.isAscendingArrival) {
        currentFlapSpeed = b.speed * 1.25;
      }

      b.wingPhase = (b.wingPhase + dt * currentFlapSpeed) % (Math.PI * 2);
      const phase = b.wingPhase;

      if (b.state === 'landing_rest') {
          if (b.isCeremony) {
              const restTime = b.ceremonyRestTimer || 0;
              const settleProg = Math.min(1.0, restTime / 2.2);
              const easeSettle = settleProg * settleProg * (3.0 - 2.0 * settleProg);

              const wingWave = Math.sin(phase);
              const activeFold = (0.40 + wingWave * 0.60) * (1.0 - easeSettle);
              const restingFold = 0.12 * easeSettle + Math.sin(time * 2.0 + b.seed) * 0.02 * easeSettle;

              const finalFold = activeFold + restingFold;
              b.leftWing.rotation.y = baseRotL + finalFold;
              b.rightWing.rotation.y = baseRotR - finalFold;

              b.innerGroup.rotation.set(0, 0, 0);
              b.innerGroup.position.set(0, 0, 0);
              b.strokePower = 0;
          } else {
              b.flapAmp *= 0.92; 
              const restPhase = (time * 3.5 + b.seed);
              const restCycle = Math.sin(restPhase);

              const restFold = 1.15;
              const flap = restCycle * 0.08 * b.flapAmp;

              b.leftWing.rotation.y = baseRotL + flap + restFold * (1 - b.flapAmp);
              b.rightWing.rotation.y = baseRotR - flap - restFold * (1 - b.flapAmp);
              b.innerGroup.rotation.z = Math.sin(time * 2.0 + b.seed) * 0.02;
              b.innerGroup.rotation.x = Math.PI / 2;
              b.innerGroup.rotation.y = Math.PI;
              b.innerGroup.position.set(0, 0, 0);
              b.strokePower = 0;
          }
      } else {
          b.flapAmp += (1.0 - b.flapAmp) * 0.1; 
          
          const wingWave = Math.sin(phase);
          const strokePower = (wingWave < 0) ? Math.sin(-wingWave * Math.PI * 0.5) * 0.55 : 0;
          b.strokePower = strokePower;

          const wingFold = (0.40 + wingWave * 0.60) * b.flapAmp;
          b.leftWing.rotation.y = baseRotL + wingFold;
          b.rightWing.rotation.y = baseRotR - wingFold;

          b.innerGroup.rotation.x = b.isCeremony ? 0 : Math.PI / 2;
          b.innerGroup.rotation.y = b.isCeremony ? 0 : Math.PI;
          b.innerGroup.position.set(0, 0, 0);
          b.innerGroup.rotation.z = Math.sin(phase) * 0.025 * b.flapAmp;
      }

      const bobAmp = 0.09 * b.flapAmp;
      const currentBobY = Math.cos(phase) * bobAmp;
      const deltaBobY = currentBobY - (b.prevBobY || 0);
      b.prevBobY = currentBobY;
      b.group.position.y += deltaBobY;

      let isFollowing = false;

      if (b.isCeremony) {
          isFollowing = true;

          // 🌟 [수정 반영] 세레머니 나비도 아래쪽에서 위로 피어오르는 초미세 팅커벨 가루 스폰
          if (b.ceremonyStage === 'rising' || b.ceremonyStage === 'flying_up') {
              spawnCeremonyParticle(b.group.position);
              if (Math.random() < 0.6) spawnCeremonyParticle(b.group.position);
          } else if (b.ceremonyStage === 'resting' && Math.random() < 0.2) {
              spawnCeremonyParticle(b.group.position);
          }

          if (b.ceremonyStage === 'rising') {
              b.state = 'flying';
              const dy = 0.3 - b.group.position.y;

              if (dy > 0.008) {
                  const speedFactor = Math.min(1.0, Math.max(0.12, dy / 2.0));
                  b.group.position.y += 0.034 * speedFactor * (dt * 60.0);
                  b.group.position.x += (0 - b.group.position.x) * 0.055;
                  b.group.position.z = 8.0;

                  b.innerGroup.rotation.set(0, 0, 0);
                  b.group.rotation.set(0.06 * speedFactor, 0, 0);
              } else {
                  b.group.position.set(0, 0.3, 8.0);
                  b.velocity.set(0, 0, 0);
                  b.group.rotation.set(0, 0, 0);
                  b.innerGroup.rotation.set(0, 0, 0);
                  b.ceremonyStage = 'resting';
                  b.ceremonyRestTimer = 0;
                  b.state = 'landing_rest';
                  activeCeremonyButterfly = b;
                  triggerCeremonyCardSequence(b);
              }
          }
          else if (b.ceremonyStage === 'resting') {
              b.state = 'landing_rest';
              b.velocity.set(0, 0, 0);
              b.group.position.set(0, 0.3, 8.0);

              b.innerGroup.rotation.set(0, 0, 0);
              b.group.rotation.set(0, 0, 0);

              b.ceremonyRestTimer = (b.ceremonyRestTimer || 0) + dt;
              if (b.ceremonyRestTimer > 14.0) {
                  if (floatingInfoCard) floatingInfoCard.classList.remove('visible');
                  b.ceremonyStage = 'flying_up';
                  b.takeoffTimer = 0;
                  b.state = 'flying';
                  b.velocity.set(0, 0.009, 0);
              }
          }
          else if (b.ceremonyStage === 'flying_up') {
              b.state = 'flying';
              b.takeoffTimer = (b.takeoffTimer || 0) + dt;

              const takeoffProgress = Math.min(1.0, b.takeoffTimer / 2.8);
              b.velocity.y = 0.009 + 0.11 * Math.pow(takeoffProgress, 1.6);
              b.velocity.x += Math.sin(time * 2.5 + b.seed) * 0.0022;

              _vStep.copy(b.velocity).multiplyScalar(dt * 60.0);
              b.group.position.add(_vStep);

              b.innerGroup.rotation.set(0, 0, 0);
              b.group.rotation.set(0.12 * takeoffProgress, 0, b.velocity.x * -5.0);

              if (b.group.position.y > 8.5) {
                  b.isCeremony = false;
                  b.ceremonyStage = null;
                  b.innerGroup.rotation.x = Math.PI / 2;
                  b.innerGroup.rotation.y = Math.PI;
                  b.speedBase = 0.110;
                  b.screenAngle = Math.random() * Math.PI * 2;
                  b.depthAngle = (Math.random() - 0.5) * 0.35;
                  userFlock.push(b);

                  if (userFlock.length > MAX_USER_BUTTERFLIES) {
                      const oldest = userFlock.shift();
                      disposeButterfly(oldest);
                  }

                  activeCeremonyButterfly = null;
                  isCeremonyActive = false;
                  triggerNextCeremonyWithDelay(5000);
              }
          }
      }
      else if (b.isSpecialLanding) {
          isFollowing = true;

          // 🌟 [수정 반영] 손가락 나비도 아래쪽에서 위로 피어오르는 초미세 팅커벨 가루 스폰
          if (b.specialState === 'approaching' || b.specialState === 'leaving') {
              spawnEnergyParticle(b.group.position);
              spawnEnergyParticle(b.group.position);
              if (Math.random() < 0.6) spawnEnergyParticle(b.group.position);
          }

          if (b.specialState === 'approaching') {
              const dx = b.group.position.x - handTarget3D.x;
              const dy = b.group.position.y - handTarget3D.y;
              const dist2D = Math.hypot(dx, dy);

              if (dist2D < 1.3) {
                  b.group.position.z = 8.0;
                  b.specialState = 'landed';
                  triggerLandingStorySequence(b);
              } else {
                  b.state = 'flying';
                  _vDir.subVectors(handTarget3D, b.group.position);
                  _vDir.z = 0; 
                  _vDir.normalize().multiplyScalar(0.13);
                  b.velocity.lerp(_vDir, 0.06); 
                  
                  _vTargetPos.copy(b.group.position).add(b.velocity);
                  dummyObj.position.copy(b.group.position);
                  dummyObj.lookAt(_vTargetPos);
                  const approachBank = Math.max(-0.6, Math.min(0.6, b.velocity.x * 2.5));
                  dummyObj.rotateZ(approachBank); 
                  b.group.quaternion.slerp(dummyObj.quaternion, 0.16);
              }
          }
          
          if (b.specialState === 'landed') {
              b.state = 'landing_rest';
              b.velocity.set(0, 0, 0);
              b.group.position.x += (handTarget3D.x - b.group.position.x) * 0.12;
              b.group.position.y += (handTarget3D.y - b.group.position.y) * 0.12;
              b.group.position.z = 8.0;
              
              dummyObj.position.copy(b.group.position);
              dummyObj.lookAt(camera.position); 
              dummyObj.rotateY(Math.PI / 2);
              dummyObj.rotateZ(0.25);
              b.group.quaternion.slerp(dummyObj.quaternion, 0.18);
          }

          if (b.specialState === 'leaving') {
              b.state = 'flying';

              const organicWobbleY = Math.sin(time * 3.2 + b.seed) * 1.6 + Math.cos(time * 6.0 + b.seed * 1.5) * 0.7;
              const organicWobbleZ = Math.sin(time * 2.5 + b.seed * 1.8) * 3.2;

              _vLeave.set(
                  18.0,
                  10.5 + organicWobbleY * 0.25, 
                  8.0 + organicWobbleZ
              );

              _vDir.subVectors(_vLeave, b.group.position).normalize().multiplyScalar(0.14);
              _vDir.y += Math.sin(time * 4.5 + b.seed) * 0.04;
              _vDir.z += Math.cos(time * 3.8 + b.seed) * 0.05;

              b.velocity.lerp(_vDir, 0.05); 
              
              _vTargetPos.copy(b.group.position).add(b.velocity);
              dummyObj.position.copy(b.group.position);
              dummyObj.lookAt(_vTargetPos);

              const bankRoll = Math.max(-0.6, Math.min(0.6, -(b.velocity.y * 4.0) + (b.velocity.x * 1.5)));
              dummyObj.rotateZ(bankRoll);
              dummyObj.rotateX(Math.sin(time * 4.0 + b.seed) * 0.15);

              b.group.quaternion.slerp(dummyObj.quaternion, 0.14);

              if (b.group.position.x > 15.0 || b.group.position.y > 9.5) {
                  disposeButterfly(specialButterfly);
                  specialButterfly = null;
                  return;
              }
          }
      } 
      else if (isHandDetected) {
          if (interactionMode === 'fist_gather' && fistButterflies.includes(b.id)) {
              isFollowing = true;
              b.state = 'flying';
              
              const orbitIdx = fistButterflies.indexOf(b.id);
              const orbitAngle = time * 1.45 + (orbitIdx * ((Math.PI * 2) / fistButterflies.length)) + b.seed * 0.1;
              const orbitRadius = 2.4 + (orbitIdx * 0.45);
              const heightOffset = Math.sin(orbitAngle * 1.1 + orbitIdx) * 1.2;
              const depthOffset = Math.cos(orbitAngle * 0.9 + orbitIdx) * 1.0;

              _vOrbit.set(
                Math.cos(orbitAngle) * orbitRadius,
                heightOffset,
                depthOffset
              );
              _vTargetPos.copy(handTarget3D).add(_vOrbit);
              
              _vDir.subVectors(_vTargetPos, b.group.position).normalize().multiplyScalar(0.24);
              b.velocity.lerp(_vDir, 0.10);
              b.velocity.x += (Math.random() - 0.5) * 0.008;
              b.velocity.y += (Math.random() - 0.5) * 0.008;

              _vTargetPos.copy(b.group.position).add(b.velocity);
              dummyObj.position.copy(b.group.position);
              dummyObj.lookAt(_vTargetPos);
              const fistBank = Math.max(-0.6, Math.min(0.6, b.velocity.x * 2.5));
              dummyObj.rotateZ(fistBank); 
              b.group.quaternion.slerp(dummyObj.quaternion, 0.12);
          }
          else if (interactionMode === 'scatter' && !specialButterfly) {
              const dist = b.group.position.distanceTo(handTarget3D);
              if (dist < 26.0) {
                  isFollowing = true;
                  b.state = 'flying';
                  _vDir.subVectors(b.group.position, handTarget3D);
                  _vDir.z = 0; 
                  _vDir.normalize();
                  b.velocity.addScaledVector(_vDir, 0.06); 
                  b.velocity.z *= 0.85; 
              }
          } 
      }

      if (!isFollowing && !b.isAscendingArrival) {
          b.state = 'flying';

          if (b.screenAngle === undefined) {
              b.screenAngle = Math.atan2(b.velocity.y, b.velocity.x) || (Math.random() * Math.PI * 2);
              b.depthAngle = (b.velocity.z / (b.speedBase || 0.11)) * 0.4 || 0;
              b.speedBase = 0.110 + (b.seed % 100) * 0.00025;
              b.turnRateAngle = 0;
              b.turnRateDepth = 0;
              b.angleBias = (Math.random() - 0.5) * 0.035;
              b.rollBias = (Math.random() - 0.5) * 0.10;
              b.dirChangeTimer = Math.random() * 3.0;
          }

          b.dirChangeTimer += dt;
          if (b.dirChangeTimer > 2.2 + (b.seed % 1.8)) {
              b.dirChangeTimer = 0;
              b.angleBias = (Math.random() - 0.5) * 0.045;
          }

          const organicTurn = Math.sin(time * 0.55 + b.seed) * 0.035 
                            + Math.cos(time * 0.85 + b.seed * 1.4) * 0.028 
                            + (b.angleBias || 0);

          let steerX = 0, steerY = 0, steerZ = 0;
          if (b.group.position.x > 11.5) steerX = -1;
          else if (b.group.position.x < -11.5) steerX = 1;

          if (b.group.position.y > 5.0) steerY = -1;
          else if (b.group.position.y < -5.0) steerY = 1;

          if (b.group.position.z > 1.2) steerZ = -1;
          else if (b.group.position.z < -6.0) steerZ = 1;

          if (steerX !== 0 || steerY !== 0) {
              const targetY = steerY !== 0 ? steerY : Math.sin(b.screenAngle);
              const targetX = steerX !== 0 ? steerX : Math.cos(b.screenAngle);
              const desiredAngle = Math.atan2(targetY, targetX);

              let diffAngle = desiredAngle - b.screenAngle;
              while (diffAngle < -Math.PI) diffAngle += Math.PI * 2;
              while (diffAngle > Math.PI) diffAngle -= Math.PI * 2;
              b.turnRateAngle = (b.turnRateAngle || 0) * 0.84 + diffAngle * 0.08 * 0.18;
          } else {
              b.turnRateAngle = (b.turnRateAngle || 0) * 0.86 + organicTurn * 0.15;
          }

          if (steerZ !== 0) {
              const targetDepth = steerZ > 0 ? 0.35 : -0.35;
              b.turnRateDepth = (b.turnRateDepth || 0) * 0.84 + (targetDepth - (b.depthAngle || 0)) * 0.08 * 0.16;
          } else {
              const organicDepth = Math.sin(time * 0.45 + b.seed * 2.1) * 0.30;
              b.turnRateDepth = (b.turnRateDepth || 0) * 0.88 + (organicDepth - (b.depthAngle || 0)) * 0.05 * 0.14;
          }

          b.screenAngle += b.turnRateAngle;
          b.depthAngle = Math.max(-0.45, Math.min(0.45, (b.depthAngle || 0) + b.turnRateDepth));

          const currentStroke = b.strokePower || 0;
          const forwardSurge = 1.0 + (currentStroke * 0.55);
          const currentSpeed = b.speedBase * forwardSurge;

          const cosD = Math.cos(b.depthAngle);
          b.velocity.x = cosD * Math.cos(b.screenAngle) * currentSpeed;
          b.velocity.y = cosD * Math.sin(b.screenAngle) * currentSpeed;
          b.velocity.z = Math.sin(b.depthAngle) * currentSpeed;
      }

      let maxSpeed = 0.27;
      if (b.isSpecialLanding) {
          maxSpeed = (b.specialState === 'leaving') ? 0.18 : 0.15;
      } else if (b.isCeremony) {
          maxSpeed = 0.24;
      } else if (isFollowing && interactionMode === 'scatter') {
          maxSpeed = 0.20; 
      } else if (isFollowing && interactionMode === 'fist_gather') {
          maxSpeed = 0.32;
      }

      if (b.velocity.length() > maxSpeed) {
          b.velocity.multiplyScalar(0.92);
      }
      
      const timeFactor = dt * 60.0;
      _vStep.copy(b.velocity).multiplyScalar(timeFactor);
      b.group.position.add(_vStep);

      if (b.velocity.lengthSq() > 0.00001 && b.state === 'flying' && !isFollowing) {
        _vTargetPos.set(
          b.group.position.x + b.velocity.x,
          b.group.position.y + b.velocity.y,
          b.group.position.z + b.velocity.z
        );

        dummyObj.position.copy(b.group.position);
        dummyObj.lookAt(_vTargetPos); 

        const turnBank = Math.max(-0.6, Math.min(0.6, -(b.turnRateAngle || 0) * 15.0));
        const wobbleRoll = Math.sin(time * 1.5 + b.seed * 2.5) * 0.12 + (b.rollBias || 0);
        const strokeWobble = Math.sin(phase) * 0.04;

        const rollAngle = Math.max(-0.75, Math.min(0.75, turnBank + wobbleRoll + strokeWobble));

        dummyObj.rotateZ(rollAngle);

        b.group.quaternion.slerp(dummyObj.quaternion, 0.16);
      }
    }

    let releaseLandingTimer = null;
    let accumulatedTime = 0;

    function animate() {
      requestAnimationFrame(animate);
      const rawDt = clock.getDelta();
      const dt = Math.min(rawDt, 0.05);
      accumulatedTime += dt;
      const time = accumulatedTime;

      updateCeremonyParticles(dt);
      updateEnergyParticles(dt);

      if (isHandDetected) {
        handTarget3D.lerp(targetHandPos3D, 0.30);
        currentScreenX += (targetScreenX - currentScreenX) * 0.35;
        currentScreenY += (targetScreenY - currentScreenY) * 0.35;
        
        if (handPointer) {
          handPointer.style.transform = `translate3d(${currentScreenX - 26}px, ${currentScreenY - 26}px, 0)`;
        }
        if (floatingConcernCard && floatingConcernCard.classList.contains('visible')) { 
          floatingConcernCard.style.transform = `translate3d(${currentScreenX + 260}px, ${currentScreenY - 145}px, 0)`; 
        }
        if (floatingInfoCard && floatingInfoCard.classList.contains('visible') && !activeCeremonyButterfly) { 
          floatingInfoCard.style.transform = `translate3d(${currentScreenX + 260}px, ${currentScreenY - 145}px, 0)`; 
        }
      }

      if (interactionMode === 'land_one' && isHandDetected) {
          if (releaseLandingTimer) {
              clearTimeout(releaseLandingTimer);
              releaseLandingTimer = null;
          }

          if (!specialButterfly && !activeCeremonyButterfly && !isCreatingSpecialButterfly) {
              if (!landOneGestureTimer) {
                  landOneGestureTimer = setTimeout(() => {
                      if (interactionMode === 'land_one' && isHandDetected && !specialButterfly && !activeCeremonyButterfly && !isCreatingSpecialButterfly) {
                          isCreatingSpecialButterfly = true;
                          let targetData = {};
                          let isUserButterfly = false;
                          if (rawUserDataList.length > 0) {
                              const randIdx = Math.floor(Math.random() * rawUserDataList.length);
                              targetData = rawUserDataList[randIdx];
                              isUserButterfly = true;
                          } else {
                              targetData = {
                                wing_shape: DEFAULT_BUTTERFLY_SHAPES[Math.floor(Math.random() * DEFAULT_BUTTERFLY_SHAPES.length)],
                                antenna_type: 'ball'
                              };
                          }
                          specialButterfly = buildButterfly(targetData, isUserButterfly, false, true, 8.0);
                          isCreatingSpecialButterfly = false;
                      }
                      landOneGestureTimer = null;
                  }, 2000);
              }
          }
      } else {
          if (landOneGestureTimer) {
              clearTimeout(landOneGestureTimer);
              landOneGestureTimer = null;
          }
          if (specialButterfly && !releaseLandingTimer) {
              releaseLandingTimer = setTimeout(() => {
                  if (specialButterfly) specialButterfly.specialState = 'leaving';
                  resetHandCards();
                  releaseLandingTimer = null;
              }, 450);
          }
      }

      for (let i = 0; i < defaultFlock.length; i++) updateMotion(defaultFlock[i], dt, time);
      for (let i = 0; i < userFlock.length; i++) updateMotion(userFlock[i], dt, time);
      if (specialButterfly) updateMotion(specialButterfly, dt, time);
      if (activeCeremonyButterfly) updateMotion(activeCeremonyButterfly, dt, time);
      
      prevHandTarget3D.copy(handTarget3D); 
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* ========================================================
       2. Supabase 실시간 연동 및 동시다발 전송 순차 큐 시스템
       ======================================================== */
    const ceremonyQueue = [];
    let isCeremonyActive = false;
    let ceremonyCooldownTimer = null;

    function queueNewButterfly(data) {
      ceremonyQueue.push(data);
      rawUserDataList.push(data);
      if (rawUserDataList.length > 50) rawUserDataList.shift();
      triggerNextCeremonyWithDelay(5000);
    }

    function triggerNextCeremonyWithDelay(delayMs) {
      if (isCeremonyActive) return;
      if (ceremonyCooldownTimer) return;

      ceremonyCooldownTimer = setTimeout(() => {
        ceremonyCooldownTimer = null;
        startNextCeremonyFromQueue();
      }, delayMs);
    }

    function startNextCeremonyFromQueue() {
      if (isCeremonyActive) return;
      if (ceremonyQueue.length === 0) return;

      isCeremonyActive = true;
      const nextData = ceremonyQueue.shift();
      activeCeremonyButterfly = buildButterfly(nextData, true, false, false, 8.0, true);
    }

    setTimeout(() => {
      try {
        if (window.supabase) {
          const SUPABASE_URL = 'https://djmdzsbfsobsutphragw.supabase.co';
          const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqbWR6c2Jmc29ic3V0cGhyYWd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4ODQ3NTgsImV4cCI6MjEwNTQ2MDc1OH0.BC7llaSjbq6cYhDlRqrwJaycpQ6gSNcp5LgYBeM6WEM';
          const supabaseInstance = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

          function addUserButterfly(data, isDelayedArrival = false, isCeremony = false) {
            if (!data) return;

            if (isCeremony) {
              queueNewButterfly(data);
            } else {
              rawUserDataList.push(data);
              if (rawUserDataList.length > 50) rawUserDataList.shift();
              const butterfly = buildButterfly(data, true, isDelayedArrival, false, 8.0, false);
              userFlock.push(butterfly);

              if (userFlock.length > MAX_USER_BUTTERFLIES) {
                const oldest = userFlock.shift();
                disposeButterfly(oldest);
              }
            }
          }

          supabaseInstance.from('butterflies')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(MAX_USER_BUTTERFLIES)
            .then(({ data, error }) => {
              if (error) {
                console.error("Supabase 데이터 조회 오류:", error);
                return;
              }
              if (data && data.length > 0) {
                data.reverse().forEach(item => addUserButterfly(item, false, false));
              }
            })
            .catch(e => console.error("Supabase 데이터 연동 실패:", e));

          supabaseInstance.channel('public:butterflies')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'butterflies' }, (payload) => {
              if (payload && payload.new) {
                addUserButterfly(payload.new, false, true);
              }
            }).subscribe();
        }
      } catch (err) {}
    }, 1500);

    /* ========================================================
       3. 네이티브 웹캠 최적화 + 제스처 인식 (GPU 다이렉트 전송)
       ======================================================== */
    setTimeout(() => {
      try {
        if (typeof Hands !== 'undefined') {
          const videoElement = document.getElementById('webcam-video');

          const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
          hands.setOptions({ 
            maxNumHands: 1,
            modelComplexity: 0, 
            minDetectionConfidence: 0.45, 
            minTrackingConfidence: 0.45 
          });

          let scatterFrameCount = 0;
          
          hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
              const lm = results.multiHandLandmarks[0];
              const wrist = lm[0];
              const tip = lm[8];

              targetScreenX = (1 - tip.x) * window.innerWidth;
              targetScreenY = tip.y * window.innerHeight;
              handPointer.style.opacity = '1';

              _handUnprojectVec.set((1 - tip.x) * 2 - 1, -(tip.y * 2) + 1, 0.5);
              _handUnprojectVec.unproject(camera);
              _handUnprojectVec.sub(camera.position).normalize();

              const distSq = (p1, p2) => {
                const dx = p1.x - p2.x, dy = p1.y - p2.y;
                return dx * dx + dy * dy;
              };

              const isIndexOpen = distSq(lm[8], wrist) > distSq(lm[6], wrist) * 1.15;
              const isMiddleClosed = distSq(lm[12], wrist) < distSq(lm[10], wrist) * 1.15;
              const isRingClosed   = distSq(lm[16], wrist) < distSq(lm[14], wrist) * 1.15;
              const isPinkyClosed  = distSq(lm[20], wrist) < distSq(lm[18], wrist) * 1.15;

              const otherClosedCount = (isMiddleClosed ? 1 : 0) + (isRingClosed ? 1 : 0) + (isPinkyClosed ? 1 : 0);
              
              const isPointGesture = isIndexOpen && (otherClosedCount >= 2);
              const isTrueScatter = isIndexOpen && !isMiddleClosed && !isRingClosed && !isPinkyClosed && !isPointGesture;
              const isTrueFist = !isIndexOpen && isMiddleClosed && isRingClosed && isPinkyClosed;

              const prevMode = interactionMode;

              if (isPointGesture) {
                  scatterFrameCount = 0;
                  interactionMode = 'land_one';
                  const distance = (8 - camera.position.z) / _handUnprojectVec.z; 
                  targetHandPos3D.copy(camera.position).addScaledVector(_handUnprojectVec, distance);

              } else if (isTrueScatter) {
                  scatterFrameCount++;
                  if (scatterFrameCount > 2) {
                      interactionMode = 'scatter';
                      const distance = (8 - camera.position.z) / _handUnprojectVec.z; 
                      targetHandPos3D.copy(camera.position).addScaledVector(_handUnprojectVec, distance);
                      resetHandCards();
                  }

              } else if (isTrueFist) {
                  scatterFrameCount = 0;
                  interactionMode = 'fist_gather';
                  const distance = (0 - camera.position.z) / _handUnprojectVec.z; 
                  targetHandPos3D.copy(camera.position).addScaledVector(_handUnprojectVec, distance);
                  resetHandCards();

                  if (prevMode !== 'fist_gather') {
                      const allFlock = [...defaultFlock, ...userFlock];
                      allFlock.sort((a, b) => a.group.position.distanceTo(handTarget3D) - b.group.position.distanceTo(handTarget3D));
                      fistButterflies = allFlock.slice(0, 5).map(b => b.id);
                  }
              } else {
                  scatterFrameCount = 0;
                  if (interactionMode !== 'land_one') {
                      interactionMode = 'none';
                      fistButterflies = [];
                      resetHandCards();
                  }
              }
              isHandDetected = true;
            } else {
              scatterFrameCount = 0;
              handPointer.style.opacity = '0';
              isHandDetected = false;
              interactionMode = 'none';
              fistButterflies = [];
              resetHandCards();
            }
          });

          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({
              video: { width: { ideal: 360, max: 480 }, height: { ideal: 270, max: 360 }, frameRate: { ideal: 30 } },
              audio: false
            }).then((stream) => {
              videoElement.srcObject = stream;
              videoElement.onloadedmetadata = () => {
                videoElement.play();
                let isProcessingFrame = false;

                function processVideoLoop() {
                  if (!isProcessingFrame && videoElement.readyState >= 2) {
                    isProcessingFrame = true;
                    hands.send({ image: videoElement })
                      .catch(() => {})
                      .finally(() => {
                        isProcessingFrame = false;
                        setTimeout(processVideoLoop, 80);
                      });
                  } else {
                    setTimeout(processVideoLoop, 40);
                  }
                }
                processVideoLoop();
              };
            }).catch((err) => { console.warn("웹캠 접근 실패:", err); });
          }
        }
      } catch (err) {}
    }, 2000);
  </script>
