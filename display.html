<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOUL : Luminous Space</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: #000000; user-select: none; cursor: none;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard Variable", Pretendard, sans-serif;
    }
    #webcam-video {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; transform: scaleX(-1) translateZ(0);
      z-index: 0; pointer-events: none;
      opacity: 0.28;
      will-change: transform;
    }
    #video-dark-overlay {
      position: absolute; inset: 0;
      background: #000000;
      opacity: 0.65;
      z-index: 1; pointer-events: none;
    }
    #three-canvas-container {
      position: absolute; inset: 0; z-index: 10;
      transform: translateZ(0);
      will-change: transform;
    }

    #hand-pointer {
      position: absolute; 
      top: 0; left: 0;
      width: 52px; height: 52px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      pointer-events: none; z-index: 30; opacity: 0; 
      transition: opacity 0.2s ease;
      will-change: transform, opacity;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #hand-pointer::after {
      content: '';
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    /* 1단계: 고민 안내 카드 - translate3d로 GPU 레이어에서만 부드럽게 이동 */
    #floating-concern-card {
      position: absolute;
      top: 0; left: 0;
      width: 320px;
      min-height: 180px;
      padding: 40px 38px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
      z-index: 42;
      opacity: 0;
      transition: opacity 0.35s ease;
      will-change: transform, opacity;
    }

    #floating-concern-card::before {
      content: '';
      position: absolute;
      inset: -10px;
      background: radial-gradient(ellipse 65% 55% at center, rgba(12, 12, 15, 0.96) 0%, rgba(12, 12, 15, 0.88) 50%, rgba(0, 0, 0, 0) 100%);
      z-index: -1;
      border-radius: 50%;
    }

    #floating-concern-card.visible {
      opacity: 1;
    }

    .concern-badge-tag {
      display: inline-block;
      color: #ffffff;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.3px;
      margin-bottom: 8px;
      z-index: 2;
    }

    #floating-concern-reason {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.55;
      color: #f0f0f5;
      word-break: keep-all;
      z-index: 2;
      min-height: 38px;
    }

    /* 2단계: 다정한 한마디 카드 */
    #floating-info-card {
      position: absolute;
      top: 0; left: 0;
      width: 320px;
      min-height: 180px;
      padding: 40px 38px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
      z-index: 40;
      opacity: 0;
      transition: opacity 0.35s ease;
      will-change: transform, opacity;
    }
    #floating-info-card::before {
      content: '';
      position: absolute;
      inset: -10px;
      background: radial-gradient(ellipse 65% 55% at center, rgba(255, 255, 255, 0.98) 0%, rgba(255, 255, 255, 0.88) 45%, rgba(255, 255, 255, 0) 100%);
      z-index: -1;
      border-radius: 50%;
    }
    #floating-info-card.visible {
      opacity: 1;
    }

    #floating-butterfly-name {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #08080a;
      margin-bottom: 5px;
      z-index: 2;
    }

    #floating-butterfly-memo {
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.45;
      color: #1a1a20;
      word-break: keep-all;
      z-index: 2;
      min-height: 36px;
    }

    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      vertical-align: middle;
      background-color: currentColor;
      margin-left: 2px;
      animation: cursorBlink 0.75s infinite;
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    #gesture-guide-banner {
      position: absolute;
      bottom: 2.2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.8rem;
      padding: 0.5rem 1.0rem;
      background: transparent !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      white-space: nowrap;
      will-change: transform;
    }

    .guide-banner-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 13.5px;
      color: #e5e5ea;
      letter-spacing: -0.2px;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
    }
    .guide-banner-item strong {
      color: #ffffff;
      font-weight: 700;
    }
    .guide-banner-divider {
      width: 1px;
      height: 13px;
      background: rgba(255, 255, 255, 0.28);
    }
  </style>
</head>
<body>

  <video id="webcam-video" playsinline autoplay muted></video>
  <div id="video-dark-overlay"></div>
  <div id="three-canvas-container"></div>
  <div id="hand-pointer"></div>

  <!-- 1단계: 고민 안내 카드 -->
  <div id="floating-concern-card">
    <div id="floating-concern-tag" class="concern-badge-tag">#완벽주의 강박</div>
    <div id="floating-concern-reason"></div>
  </div>

  <!-- 2단계: 다정한 한마디 카드 -->
  <div id="floating-info-card">
    <div id="floating-butterfly-name">‘나비’</div>
    <div id="floating-butterfly-memo"></div>
  </div>

  <!-- 하단 안내 배너 -->
  <aside id="gesture-guide-banner">
    <div class="guide-banner-item">
      <span>👉</span>
      <span><strong>손가락 하나</strong> 나비가 손끝에 내려앉아요. 나비와 함께 교감해 보세요.</span>
    </div>
    <div class="guide-banner-divider"></div>
    <div class="guide-banner-item">
      <span>✊</span>
      <span><strong>주먹을 쥐면</strong> 나비들이 곁으로 모여들어요.</span>
    </div>
    <div class="guide-banner-divider"></div>
    <div class="guide-banner-item">
      <span>🖐️</span>
      <span><strong>손을 펼치면</strong> 나비들이 흩어져 날아가요.</span>
    </div>
  </aside>

  <script>
    /* ========================================================
       1. Three.js 설정 및 최적화 재질/지오메트리 구축
       ======================================================== */
    const BUTTERFLY_SHAPES = [
      'crescent',
      'dawn-ray',
      'ember',
      'moon-halo',
      'petal',
      'starlight',
      'wave-fin'
    ];

    // 🌟 완전 불투명 고성능 단일 순백 재질 (ShaderMaterial 완전 대체 및 드로우 콜 최소화)
    const sharedWhiteMat = new THREE.MeshBasicMaterial({ 
      color: 0xffffff, 
      side: THREE.DoubleSide, 
      transparent: false, 
      depthWrite: true 
    });

    function createStableWingGeom(isRight) {
      const shape = new THREE.Shape();
      const s = isRight ? 1 : -1;
      shape.moveTo(0, 0.5);
      shape.bezierCurveTo(s * 0.4, 1.0, s * 1.5, 2.0, s * 2.4, 1.8);
      shape.bezierCurveTo(s * 3.0, 1.6, s * 2.8, 0.8, s * 2.2, 0.2);
      shape.bezierCurveTo(s * 2.5, -0.4, s * 2.2, -1.5, s * 1.6, -1.8);
      shape.bezierCurveTo(s * 1.0, -2.0, s * 0.4, -1.6, s * 0.2, -1.0);
      shape.bezierCurveTo(s * 0.1, -0.6, s * 0.05, -0.2, 0, -0.5);
      shape.lineTo(0, 0.5);

      const geom = new THREE.ShapeGeometry(shape, 8);
      geom.computeVertexNormals();
      geom.computeBoundingBox();
      const bb = geom.boundingBox;
      const sizeX = bb.max.x - bb.min.x || 1;
      const sizeY = bb.max.y - bb.min.y || 1;
      const pos = geom.attributes.position;
      const uvs = [];

      for (let i = 0; i < pos.count; i++) {
        uvs.push((pos.getX(i) - bb.min.x) / sizeX, (pos.getY(i) - bb.min.y) / sizeY);
      }
      geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      return geom;
    }

    function createBodyGeom() {
      const points = [
        new THREE.Vector2(0.001, 0.8), new THREE.Vector2(0.14, 0.7),
        new THREE.Vector2(0.10, 0.5), new THREE.Vector2(0.18, 0.3),
        new THREE.Vector2(0.12, 0.0), new THREE.Vector2(0.15, -0.2),
        new THREE.Vector2(0.12, -0.4), new THREE.Vector2(0.08, -0.7),
        new THREE.Vector2(0.001, -0.9)
      ];
      return new THREE.LatheGeometry(points, 6);
    }

    function createAntenna(isRight, mat) {
      const group = new THREE.Group();
      const s = isRight ? 1 : -1;
      const curve = new THREE.CubicBezierCurve3(
        new THREE.Vector3(0, 0, 0), new THREE.Vector3(s * 0.2, 0.5, 0.1),
        new THREE.Vector3(s * 0.5, 0.9, 0.2), new THREE.Vector3(s * 0.65, 1.2, 0.3)
      );
      const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 6, 0.035, 3, false), mat);
      group.add(tube);
      const tip = new THREE.Mesh(new THREE.SphereGeometry(0.09, 5, 5), mat);
      tip.position.set(s * 0.65, 1.2, 0.3);
      group.add(tip);
      return group;
    }

    /* 🌟 자체 발광/오라/커스텀 셰이더를 일체 삭제하고 100% 완전 불투명 표준 MeshBasicMaterial 적용 */
    function createStandardWingMaterial(textureURL) {
      const photoTex = textureLoader.load(textureURL);
      photoTex.flipY = false;
      if (THREE.sRGBEncoding) photoTex.encoding = THREE.sRGBEncoding;

      return new THREE.MeshBasicMaterial({
        map: photoTex,
        side: THREE.DoubleSide,
        transparent: false,
        depthWrite: true
      });
    }

    /* 🌟 날개 메쉬 지오메트리에 평면 투영 UV를 1회 직접 주입 (셰이더 연산 완전 대체) */
    function applyProjectedUVsToGeometry(geometry) {
      if (!geometry || !geometry.attributes || !geometry.attributes.position) return;
      const pos = geometry.attributes.position;
      const uvs = new Float32Array(pos.count * 2);

      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        const u = Math.max(0.0, Math.min(1.0, (x + 2.4) / 4.8));
        const v = Math.max(0.0, Math.min(1.0, 1.0 - (y + 2.4) / 4.8));
        uvs[i * 2 + 0] = u;
        uvs[i * 2 + 1] = v;
      }
      geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
      geometry.attributes.uv.needsUpdate = true;
    }

    /* 🌟 프로미스 기반 싱글톤 모델 캐시 (중복 네트워크 요청 및 404 지연 원천 차단) */
    const modelCache = {};
    const modelLoadingPromises = {};
    let resolvedBasePath = null;

    const candidateBases = [
      '3DButterfly/',
      './3DButterfly/',
      '../3DButterfly/',
      'index/3DButterfly/',
      '../index/3DButterfly/'
    ];

    function getOrLoadModel(modelName) {
      if (modelCache[modelName]) {
        return Promise.resolve(modelCache[modelName]);
      }
      if (modelLoadingPromises[modelName]) {
        return modelLoadingPromises[modelName];
      }

      const bases = resolvedBasePath ? [resolvedBasePath] : candidateBases;

      modelLoadingPromises[modelName] = new Promise((resolve) => {
        let idx = 0;
        function tryNext() {
          if (idx >= bases.length) {
            resolve(null);
            return;
          }
          const base = bases[idx++];
          const fullPath = base + modelName + '.glb';

          gltfLoader.load(
            fullPath,
            (gltf) => {
              resolvedBasePath = base;
              modelCache[modelName] = gltf.scene;
              resolve(gltf.scene);
            },
            undefined,
            () => {
              tryNext();
            }
          );
        }
        tryNext();
      });

      return modelLoadingPromises[modelName];
    }

    const container = document.getElementById('three-canvas-container');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 14.5);

    // 🌟 pixelRatio를 1.0으로 고정하여 GPU 부하 원천 차단
    const renderer = new THREE.WebGLRenderer({ 
      alpha: true, 
      antialias: false, 
      powerPreference: "high-performance",
      precision: "mediump",
      stencil: false
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(1.0);
    if (THREE.sRGBEncoding) {
      renderer.outputEncoding = THREE.sRGBEncoding;
    }
    container.appendChild(renderer.domElement);

    // 🌟 순백 조명
    const ambLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(0, 5, 10);
    scene.add(dirLight);

    const textureLoader = new THREE.TextureLoader();
    const gltfLoader = new THREE.GLTFLoader();
    const leftGeom = createStableWingGeom(false);
    const rightGeom = createStableWingGeom(true);
    const bodyGeom = createBodyGeom();

    const defaultFlock = [];
    const userFlock = [];
    // 🌟 성능 최적화: 유저 나비 최대 개수를 8마리로 제한하여 총 15마리 안팎으로 60 FPS 유지
    const MAX_USER_BUTTERFLIES = 8;
    const rawUserDataList = [];

    function buildButterfly(data = {}, isUser = false, isDelayedArrival = false, isFingerTarget = false, customZ = 0) {
      const group = new THREE.Group();
      const innerGroup = new THREE.Group(); 
      
      let leftWing = new THREE.Mesh(leftGeom, sharedWhiteMat);
      let rightWing = new THREE.Mesh(rightGeom, sharedWhiteMat);
      const defaultBody = new THREE.Mesh(bodyGeom, sharedWhiteMat);

      innerGroup.add(leftWing);
      innerGroup.add(rightWing);
      innerGroup.add(defaultBody);
      
      const aL = createAntenna(false, sharedWhiteMat); aL.position.set(-0.05, 0.7, 0.15); innerGroup.add(aL);
      const aR = createAntenna(true, sharedWhiteMat); aR.position.set(0.05, 0.7, 0.15); innerGroup.add(aR);

      innerGroup.rotation.x = Math.PI / 2;
      group.add(innerGroup);

      // 🌟 형태 배정 및 기본 더듬이(구슬 더듬이 'ball') 적용
      const shapeId = data.wing_shape || BUTTERFLY_SHAPES[Math.floor(Math.random() * BUTTERFLY_SHAPES.length)];
      const antId = data.antenna_type || 'ball';
      const targetAntennaPrefix = 'Antenna_' + antId;

      const textureURL = data.texture_url || data.image_url;
      const hasTexture = !!(isUser && textureURL);

      // 🌟 셰이더 및 자체 발광 일체 삭제 -> 100% 표준 MeshBasicMaterial 사용
      const wingMat = hasTexture ? createStandardWingMaterial(textureURL) : sharedWhiteMat;

      if (gltfLoader) {
        getOrLoadModel(shapeId).then((sceneTemplate) => {
          if (!sceneTemplate) return;
          const model = sceneTemplate.clone(true);
          let newWingL = null, newWingR = null;
          const meshesToRemove = [];

          model.traverse(function(child) {
            if (child.isMesh) {
              const name = child.name || '';
              if (name.startsWith('Wing_L')) { 
                newWingL = child; 
                newWingL.userData.baseRotY = child.rotation.y;
                if (hasTexture) applyProjectedUVsToGeometry(child.geometry);
                child.material = wingMat; 
              }
              else if (name.startsWith('Wing_R')) { 
                newWingR = child; 
                newWingR.userData.baseRotY = child.rotation.y;
                if (hasTexture) applyProjectedUVsToGeometry(child.geometry);
                child.material = wingMat; 
              }
              else if (name.startsWith('Body')) { 
                child.material = sharedWhiteMat; 
              }
              else if (name.startsWith('Antenna_')) { 
                if (name.startsWith(targetAntennaPrefix)) {
                  child.material = sharedWhiteMat;
                } else {
                  meshesToRemove.push(child);
                }
              }
            }
          });

          // 불필요한 더듬이 메쉬는 메모리와 씬 트리에서 완전 제거
          meshesToRemove.forEach((m) => {
            if (m.parent) m.parent.remove(m);
          });

          if (newWingL && newWingR) {
            innerGroup.remove(leftWing);
            innerGroup.remove(rightWing);
            innerGroup.remove(defaultBody);
            innerGroup.remove(aL);
            innerGroup.remove(aR);
            model.scale.set(0.95, 0.95, 0.95);
            innerGroup.add(model);
            butterflyRecord.leftWing = newWingL;
            butterflyRecord.rightWing = newWingR;
          }
        });
      }

      let initialVelocity;
      let targetScale = 0.62 + Math.random() * 0.14;

      const initialYaw = Math.random() * Math.PI * 2;
      const initialPitch = (Math.random() - 0.5) * 0.80; 
      
      const targetBPM = 90;
      const flapSpeed = (targetBPM / 60) * 2 * Math.PI * 2;
      const initialSpeed = 0.085 + Math.random() * 0.025;

      // 🌟 [요청 반영]: 손가락으로 오는 나비의 크기 축소 (0.88 -> 0.44)
      if (isFingerTarget) {
        group.position.set(-18, 14, customZ);
        initialVelocity = new THREE.Vector3(0, 0, 0);
        targetScale = 0.44;
        group.scale.set(0.44, 0.44, 0.44);
      } else if (isDelayedArrival) {
        group.position.set(0, -7.0, 1.5);
        initialVelocity = new THREE.Vector3(0.04, 0.08, -0.01);
        group.scale.set(0.01, 0.01, 0.01);
      } else {
        group.position.set(
          (Math.random() - 0.5) * 18, 
          (Math.random() - 0.5) * 7.5, 
          -0.5 - Math.random() * 5.0
        );
        const cosP = Math.cos(initialPitch);
        initialVelocity = new THREE.Vector3(
          cosP * Math.cos(initialYaw) * initialSpeed,
          Math.sin(initialPitch) * initialSpeed,
          cosP * Math.sin(initialYaw) * initialSpeed
        );
        group.scale.set(targetScale, targetScale, targetScale);
      }

      scene.add(group);

      const butterflyRecord = {
        id: Math.random().toString(36).substring(7),
        group, innerGroup, leftWing, rightWing,
        velocity: initialVelocity,
        speed: flapSpeed,
        seed: Math.random() * 1000,
        flapAmp: 1.0, 
        state: 'flying',
        targetScale: targetScale,
        isAscendingArrival: isDelayedArrival,
        arrivalTimer: 0,
        isSpecialLanding: isFingerTarget,
        specialState: isFingerTarget ? 'approaching' : null,
        name: data.name || (isUser ? "익명의 나비" : "나비"),
        memo: data.memo || "너의 찬란한 날갯짓을 응원해.",
        core_concern: data.core_concern || (Array.isArray(data.q2) && data.q2.length > 0 ? data.q2[0] : "완벽주의 강박"),
        concern_reason: data.concern_reason || "항상 잘 해내야 한다는 마음이 앞서서요.",
        yaw: initialYaw,
        pitch: initialPitch,
        speedBase: initialSpeed,
        turnRateYaw: 0,
        turnRatePitch: 0,
        yawBias: (Math.random() - 0.5) * 0.03,
        pitchBias: (Math.random() - 0.5) * 0.025,
        rollBias: (Math.random() - 0.5) * 0.55,
        dirChangeTimer: Math.random() * 3.0,
        strokePower: 0,
        prevBobY: 0
      };

      return butterflyRecord;
    }

    // 🌟 기본 나비 7마리 생성 (7가지 3D 형태 1마리씩 분배 + 구슬 더듬이 'ball' 통일)
    for (let i = 0; i < BUTTERFLY_SHAPES.length; i++) {
      defaultFlock.push(buildButterfly({ wing_shape: BUTTERFLY_SHAPES[i], antenna_type: 'ball' }, false, false, false));
    }

    const clock = new THREE.Clock();
    const dummyObj = new THREE.Object3D(); 
    
    const _vDir = new THREE.Vector3();
    const _vTargetPos = new THREE.Vector3();
    const _vOrbit = new THREE.Vector3();
    const _vLeave = new THREE.Vector3(25, 25, 0);

    let handTarget3D = new THREE.Vector3(999, 999, 0);
    let targetHandPos3D = new THREE.Vector3(999, 999, 0);
    let prevHandTarget3D = new THREE.Vector3(999, 999, 0);
    let isHandDetected = false;
    let interactionMode = 'none';
    
    let specialButterfly = null;
    let fistButterflies = []; 
    let handPerspectiveScale = 1.0;

    const floatingConcernCard = document.getElementById('floating-concern-card');
    const floatingConcernTag = document.getElementById('floating-concern-tag');
    const floatingConcernReason = document.getElementById('floating-concern-reason');

    const floatingInfoCard = document.getElementById('floating-info-card');
    const floatingName = document.getElementById('floating-butterfly-name');
    const floatingMemo = document.getElementById('floating-butterfly-memo');

    let landingStorySequenceTimer = null;
    let activeTypingTimeout = null;

    function typeWriterText(targetElement, fullText, speed = 45, callback = null) {
      if (activeTypingTimeout) clearTimeout(activeTypingTimeout);
      targetElement.innerHTML = '';
      let index = 0;
      function step() {
        if (index <= fullText.length) {
          const currentSub = fullText.substring(0, index);
          const isDone = index === fullText.length;
          targetElement.innerHTML = `${currentSub}${isDone ? '' : '<span class="typing-cursor"></span>'}`;
          index++;
          if (!isDone) {
            activeTypingTimeout = setTimeout(step, speed);
          } else if (callback) {
            callback();
          }
        }
      }
      step();
    }

    function resetLandingCards() {
      clearTimeout(landingStorySequenceTimer);
      if (activeTypingTimeout) clearTimeout(activeTypingTimeout);
      if (floatingConcernCard) floatingConcernCard.classList.remove('visible');
      if (floatingInfoCard) floatingInfoCard.classList.remove('visible');
      if (floatingConcernReason) floatingConcernReason.innerHTML = '';
      if (floatingMemo) floatingMemo.innerHTML = '';
    }

    function triggerLandingStorySequence(b) {
      resetLandingCards();
      if (floatingConcernCard) {
        floatingConcernTag.innerText = `#${b.core_concern}`;
        floatingConcernCard.classList.add('visible');
        const fullReason = `"${b.concern_reason}"`;
        setTimeout(() => { typeWriterText(floatingConcernReason, fullReason, 45); }, 150);
      }

      landingStorySequenceTimer = setTimeout(() => {
        if (floatingConcernCard) floatingConcernCard.classList.remove('visible');
        if (floatingInfoCard) {
          floatingName.innerText = `‘${b.name}’`;
          floatingInfoCard.classList.add('visible');
          const fullMemo = `"${b.memo}"`;
          setTimeout(() => { typeWriterText(floatingMemo, fullMemo, 45); }, 150);
        }
      }, 4200);
    }

    let currentScreenX = 0, currentScreenY = 0;
    let targetScreenX = 0, targetScreenY = 0;
    const handPointer = document.getElementById('hand-pointer');

    /* ========================================================
       🌟 8분음표 1세트 + 나비 자체의 수직 바운스
       ======================================================== */
    function updateMotion(b, time) {
      let currentTargetScale = b.targetScale;
      
      // 🌟 [요청 반영]: 손끝 착석 시 기준 스케일 축소 (0.88 -> 0.44)
      if (b.isSpecialLanding && (b.specialState === 'approaching' || b.specialState === 'landed')) {
        const landingBaseScale = 0.44;
        const effectivePerspective = Math.max(0.85, handPerspectiveScale);
        currentTargetScale = landingBaseScale * effectivePerspective;
      }

      if (b.isAscendingArrival) {
        b.arrivalTimer += 0.016;
        b.group.scale.set(
          b.group.scale.x + (b.targetScale - b.group.scale.x) * 0.04,
          b.group.scale.y + (b.targetScale - b.group.scale.y) * 0.04,
          b.group.scale.z + (b.targetScale - b.group.scale.z) * 0.04
        );
        b.velocity.y *= 0.99;
        if (b.arrivalTimer > 5.5 || b.group.position.y > 0) b.isAscendingArrival = false; 
      } else {
        b.group.scale.set(
          b.group.scale.x + (currentTargetScale - b.group.scale.x) * 0.1,
          b.group.scale.y + (currentTargetScale - b.group.scale.y) * 0.1,
          b.group.scale.z + (currentTargetScale - b.group.scale.z) * 0.1
        );
      }

      const baseRotL = (b.leftWing.userData && b.leftWing.userData.baseRotY) || 0;
      const baseRotR = (b.rightWing.userData && b.rightWing.userData.baseRotY) || 0;

      let phase = 0;
      let strokePower = 0;

      if (b.state === 'landing_rest') {
          b.flapAmp *= 0.92; 
          const restCycle = Math.sin(time * 3.5 + b.seed);
          const flap = restCycle * 0.12 * b.flapAmp;
          const restFold = -1.25; 
          b.leftWing.rotation.y = baseRotL + flap + restFold * (1 - b.flapAmp);
          b.rightWing.rotation.y = baseRotR - flap - restFold * (1 - b.flapAmp);
          b.innerGroup.rotation.z = Math.sin(time * 2.0 + b.seed) * 0.04;
          b.innerGroup.rotation.x = Math.PI / 2;
          b.innerGroup.position.set(0, 0, 0);
      } else {
          b.flapAmp += (1.0 - b.flapAmp) * 0.1; 
          let currentFlapSpeed = b.speed;
          if (b.isSpecialLanding && b.specialState === 'approaching') {
            currentFlapSpeed = b.speed * 1.35;
          } else if (b.isAscendingArrival) {
            currentFlapSpeed = b.speed * 1.25;
          }

          phase = (time * currentFlapSpeed + b.seed) % (Math.PI * 2);
          
          const normPhase = phase / (Math.PI * 2);
          let wingWave;

          if (normPhase < 0.50) {
            const tUp = normPhase / 0.50;
            const smoothUp = 0.5 - 0.5 * Math.cos(tUp * Math.PI);
            wingWave = 1.0 - 2.0 * smoothUp;
            strokePower = 0;
          } else {
            const tDown = (normPhase - 0.50) / 0.50;
            const smoothDown = 0.5 - 0.5 * Math.cos(tDown * Math.PI);
            wingWave = -1.0 + 2.0 * smoothDown;
            strokePower = Math.sin(tDown * Math.PI) * 0.55;
          }
          b.strokePower = strokePower;

          const wingFold = (-0.50 + wingWave * 0.75) * b.flapAmp;
          b.leftWing.rotation.y = baseRotL + wingFold;
          b.rightWing.rotation.y = baseRotR - wingFold;

          b.innerGroup.rotation.x = Math.PI / 2;
          b.innerGroup.position.set(0, 0, 0);
          b.innerGroup.rotation.z = (Math.sin(phase * 1.5 + b.seed) * 0.05 + strokePower * 0.035) * b.flapAmp;
      }

      const bobAmp = 0.09 * b.flapAmp;
      const currentBobY = Math.cos(phase) * bobAmp;
      const deltaBobY = currentBobY - (b.prevBobY || 0);
      b.prevBobY = currentBobY;
      b.group.position.y += deltaBobY;

      let isFollowing = false;

      if (b.isSpecialLanding) {
          isFollowing = true;

          if (b.specialState === 'approaching') {
              const dx = b.group.position.x - handTarget3D.x;
              const dy = b.group.position.y - handTarget3D.y;
              const dist2D = Math.hypot(dx, dy);

              if (dist2D < 1.8) {
                  b.group.position.z = handTarget3D.z;
                  b.specialState = 'landed';
                  triggerLandingStorySequence(b);
              } else {
                  b.state = 'flying';
                  _vDir.subVectors(handTarget3D, b.group.position);
                  _vDir.z = 0; 
                  _vDir.normalize().multiplyScalar(0.26);
                  b.velocity.lerp(_vDir, 0.08); 
                  b.velocity.z = 0; 
                  
                  _vTargetPos.copy(b.group.position).add(b.velocity);
                  dummyObj.position.copy(b.group.position);
                  dummyObj.lookAt(_vTargetPos);
                  const rollAngle = (b.velocity.x * -15);
                  dummyObj.rotateZ(rollAngle); 
                  b.group.quaternion.slerp(dummyObj.quaternion, 0.18);
              }
          }
          
          if (b.specialState === 'landed') {
              b.state = 'landing_rest';
              b.velocity.set(0, 0, 0);
              b.group.position.x += (handTarget3D.x - b.group.position.x) * 0.08;
              b.group.position.y += (handTarget3D.y - b.group.position.y) * 0.08;
              b.group.position.z = handTarget3D.z;
              
              dummyObj.position.copy(b.group.position);
              dummyObj.lookAt(camera.position); 
              dummyObj.rotateY(Math.PI / 2);
              dummyObj.rotateZ(0.25);
              b.group.quaternion.slerp(dummyObj.quaternion, 0.18);
          }

          if (b.specialState === 'leaving') {
              b.state = 'flying';
              _vLeave.z = b.group.position.z;
              _vDir.subVectors(_vLeave, b.group.position).normalize().multiplyScalar(0.18);
              b.velocity.lerp(_vDir, 0.08); 
              b.velocity.z = 0; 
              
              _vTargetPos.copy(b.group.position).add(b.velocity);
              dummyObj.position.copy(b.group.position);
              dummyObj.lookAt(_vTargetPos);
              b.group.quaternion.slerp(dummyObj.quaternion, 0.10);

              if (b.group.position.x > 20 || b.group.position.y > 20) {
                  scene.remove(b.group);
                  specialButterfly = null;
                  return;
              }
          }
      } 
      else if (isHandDetected) {
          if (interactionMode === 'fist_gather' && fistButterflies.includes(b.id)) {
              isFollowing = true;
              b.state = 'flying';
              
              const orbitIdx = fistButterflies.indexOf(b.id);
              const orbitAngle = time * 1.35 + (orbitIdx * ((Math.PI * 2) / fistButterflies.length)) + b.seed * 0.1;
              const orbitRadius = 2.4 + (orbitIdx * 0.45);
              const heightOffset = Math.sin(orbitAngle * 1.1 + orbitIdx) * 1.2;
              const depthOffset = Math.cos(orbitAngle * 0.9 + orbitIdx) * 1.0;

              _vOrbit.set(
                Math.cos(orbitAngle) * orbitRadius,
                heightOffset,
                depthOffset
              );
              _vTargetPos.copy(handTarget3D).add(_vOrbit);
              
              _vDir.subVectors(_vTargetPos, b.group.position).normalize().multiplyScalar(0.22);
              b.velocity.lerp(_vDir, 0.10);
              b.velocity.x += (Math.random() - 0.5) * 0.008;
              b.velocity.y += (Math.random() - 0.5) * 0.008;

              _vTargetPos.copy(b.group.position).add(b.velocity);
              dummyObj.position.copy(b.group.position);
              dummyObj.lookAt(_vTargetPos);
              const rollAngle = (b.velocity.x * -14);
              dummyObj.rotateZ(rollAngle); 
              b.group.quaternion.slerp(dummyObj.quaternion, 0.12);
          }
          else if (interactionMode === 'scatter' && !specialButterfly) {
              const dist = b.group.position.distanceTo(handTarget3D);
              if (dist < 26.0) {
                  isFollowing = true;
                  b.state = 'flying';
                  _vDir.subVectors(b.group.position, handTarget3D);
                  _vDir.z = 0; 
                  _vDir.normalize();
                  b.velocity.addScaledVector(_vDir, 0.05); 
                  b.velocity.z *= 0.85; 
              }
          } 
      }

      if (!isFollowing && !b.isAscendingArrival) {
          b.state = 'flying';

          if (b.yaw === undefined) {
              b.yaw = Math.atan2(b.velocity.z, b.velocity.x) || (Math.random() * Math.PI * 2);
              b.pitch = (Math.random() - 0.5) * 0.80;
              b.speedBase = 0.085 + (b.seed % 100) * 0.00025;
              b.turnRateYaw = 0;
              b.turnRatePitch = 0;
              b.yawBias = (Math.random() - 0.5) * 0.03;
              b.pitchBias = (Math.random() - 0.5) * 0.025;
              b.rollBias = (Math.random() - 0.5) * 0.55;
              b.dirChangeTimer = Math.random() * 3.0;
          }

          b.dirChangeTimer += 0.016;
          if (b.dirChangeTimer > 2.8 + (b.seed % 2.5)) {
              b.dirChangeTimer = 0;
              b.yawBias = (Math.random() - 0.5) * 0.035;   
              b.pitchBias = (Math.random() - 0.5) * 0.032; 
              b.rollBias = (Math.random() - 0.5) * 0.65;   
          }

          const organicYawTurn = Math.sin(time * 0.45 + b.seed) * 0.024 
                               + Math.cos(time * 0.90 + b.seed * 1.3) * 0.020 
                               + (b.yawBias || 0);

          const organicPitchTurn = Math.sin(time * 0.60 + b.seed * 2.1) * 0.024 
                                 + (b.pitchBias || 0);

          let steerX = 0, steerZ = 0, steerY = 0;
          if (b.group.position.x > 12.5) steerX = -0.055;
          else if (b.group.position.x < -12.5) steerX = 0.055;

          if (b.group.position.z > 1.2) steerZ = -0.055;
          else if (b.group.position.z < -7.0) steerZ = 0.055;

          if (b.group.position.y > 5.5) steerY = -0.050;
          else if (b.group.position.y < -5.5) steerY = 0.050;

          if (steerX !== 0 || steerZ !== 0) {
              const desiredYaw = Math.atan2(steerZ || Math.sin(b.yaw), steerX || Math.cos(b.yaw));
              let diffYaw = desiredYaw - b.yaw;
              while (diffYaw < -Math.PI) diffYaw += Math.PI * 2;
              while (diffYaw > Math.PI) diffYaw -= Math.PI * 2;
              b.turnRateYaw = (b.turnRateYaw || 0) * 0.86 + diffYaw * 0.06 * 0.14;
          } else {
              b.turnRateYaw = (b.turnRateYaw || 0) * 0.88 + organicYawTurn * 0.12;
          }

          if (steerY !== 0) {
              const targetPitch = steerY > 0 ? 0.55 : -0.55;
              b.turnRatePitch = (b.turnRatePitch || 0) * 0.86 + (targetPitch - b.pitch) * 0.09 * 0.14;
          } else {
              b.turnRatePitch = (b.turnRatePitch || 0) * 0.88 + organicPitchTurn * 0.12;
          }

          b.yaw += b.turnRateYaw;
          b.pitch = Math.max(-1.15, Math.min(1.15, b.pitch + b.turnRatePitch));

          const currentStroke = b.strokePower || 0;
          const forwardSurge = 1.0 + (currentStroke * 0.55);
          const currentSpeed = b.speedBase * forwardSurge;

          const cosP = Math.cos(b.pitch);
          b.velocity.x = cosP * Math.cos(b.yaw) * currentSpeed;
          b.velocity.z = cosP * Math.sin(b.yaw) * currentSpeed;
          b.velocity.y = Math.sin(b.pitch) * currentSpeed;
      }

      let maxSpeed = 0.22;
      if (b.isSpecialLanding) {
          maxSpeed = 0.26;
      } else if (isFollowing && interactionMode === 'scatter') {
          maxSpeed = 0.16; 
      } else if (isFollowing && interactionMode === 'fist_gather') {
          maxSpeed = 0.28;
      }

      if (b.velocity.length() > maxSpeed) {
          b.velocity.multiplyScalar(0.92);
      }
      
      b.group.position.add(b.velocity);

      if (!b.isSpecialLanding) {
          if (b.group.position.z > 2.0) b.velocity.z -= 0.025;
          if (b.group.position.z < -7.5) b.velocity.z += 0.035;
      }

      if (b.velocity.lengthSq() > 0.00001 && b.state === 'flying' && !isFollowing) {
        _vTargetPos.set(
          b.group.position.x + b.velocity.x,
          b.group.position.y + b.velocity.y,
          b.group.position.z + b.velocity.z
        );

        dummyObj.position.copy(b.group.position);
        dummyObj.lookAt(_vTargetPos); 

        const bankRoll = Math.max(-1.3, Math.min(1.3, -(b.turnRateYaw || 0) * 16.0));
        const wobbleRoll = Math.sin(time * 1.2 + b.seed * 2.5) * 0.65 + (b.rollBias || 0);
        const rollAngle = bankRoll + wobbleRoll + Math.sin(phase) * 0.08;

        dummyObj.rotateZ(rollAngle);

        b.group.quaternion.slerp(dummyObj.quaternion, 0.16);
      }
    }

    let releaseLandingTimer = null;

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      const time = clock.getElapsedTime();

      // 🌟 [최적화]: DOM Reflow를 완전 제거하고 GPU 가속 transform만 사용
      if (isHandDetected) {

        currentScreenY += (targetScreenY - currentScreenY) * 0.3;
        
        if (handPointer) {
          handPointer.style.transform = `translate3d(${currentScreenX - 26}px, ${currentScreenY - 26}px, 0)`;
        }

        }
        if (floatingInfoCard && floatingInfoCard.classList.contains('visible')) { 
          floatingInfoCard.style.transform = `translate3d(${currentScreenX + 45}px, ${currentScreenY - 180}px, 0)`; 
        }
      }

      if (interactionMode === 'land_one' && isHandDetected) {
          if (releaseLandingTimer) {
              clearTimeout(releaseLandingTimer);
              releaseLandingTimer = null;
          }

          if (!specialButterfly) {
              let targetData = {};
              let isUserButterfly = false;
              if (rawUserDataList.length > 0) {

                  targetData = rawUserDataList[randIdx];

              releaseLandingTimer = setTimeout(() => {
                  if (specialButterfly) specialButterfly.specialState = 'leaving';
                  resetLandingCards();
                  releaseLandingTimer = null;
              }, 450);
          }
      }

      for (let i = 0; i < defaultFlock.length; i++) updateMotion(defaultFlock[i], time);
      for (let i = 0; i < userFlock.length; i++) updateMotion(userFlock[i], time);
      if (specialButterfly) updateMotion(specialButterfly, time);
      
      prevHandTarget3D.copy(handTarget3D); 
      renderer.render(scene, camera);
    }
    animate();

              const ringFolded = dist3D(lm[16], lm[13]) < dist3D(lm[14], lm[13]) * 1.15;
              const pinkyFolded = dist3D(lm[20], lm[17]) < dist3D(lm[18], lm[17]) * 1.15;

              const isIndexDominant = (indexDist > middleDist * 1.12) && (indexDist > ringDist * 1.2);
              const isOtherTwoFolded = (middleFolded ? 1 : 0) + (ringFolded ? 1 : 0) + (pinkyFolded ? 1 : 0) >= 2;
              const isPointGesture = !indexFolded && (isIndexDominant || isOtherTwoFolded);

              const isTrueScatter = !indexFolded && !middleFolded && !ringFolded && !pinkyFolded && !isPointGesture;
              const isTrueFist = indexFolded && middleFolded && ringFolded && pinkyFolded && !isPointGesture;

              const prevMode = interactionMode;

              if (isPointGesture) {
                  scatterFrameCount = 0;
                  interactionMode = 'land_one';
                  const distance = (8 - camera.position.z) / vec.z; 
                  targetHandPos3D.copy(camera.position).add(vec.multiplyScalar(distance));

              } else if (isTrueScatter) {
                  scatterFrameCount++;
                  if (scatterFrameCount > 3) {
                      interactionMode = 'scatter';
                      const distance = (8 - camera.position.z) / vec.z; 
                      targetHandPos3D.copy(camera.position).add(vec.multiplyScalar(distance));
                      resetLandingCards();
                  }

              } else if (isTrueFist) {
                  scatterFrameCount = 0;
                  interactionMode = 'fist_gather';
                  const distance = (0 - camera.position.z) / vec.z; 
                  targetHandPos3D.copy(camera.position).add(vec.multiplyScalar(distance));
                  resetLandingCards();

                  if (prevMode !== 'fist_gather') {
                      const allFlock = [...defaultFlock, ...userFlock];
                      allFlock.sort((a, b) => a.group.position.distanceTo(handTarget3D) - b.group.position.distanceTo(handTarget3D));
                      fistButterflies = allFlock.slice(0, 5).map(b => b.id);
                  }
              } else {
                  scatterFrameCount = 0;
                  if (interactionMode !== 'land_one') {
                      interactionMode = 'none';
                      fistButterflies = [];
                      resetLandingCards();
                  }
              }
              isHandDetected = true;
            } else {
              scatterFrameCount = 0;
              handPointer.style.opacity = '0';
              isHandDetected = false;
              interactionMode = 'none';
              fistButterflies = [];
              handPerspectiveScale = 1.0;
              resetLandingCards();
            }
          });

          // 🌟 640x480 비디오 스트림 및 150ms 추론 주기로 Three.js 렌더링 프레임 완전 보호
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({
              video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } },
              audio: false
            }).then((stream) => {
              videoElement.srcObject = stream;
              videoElement.onloadedmetadata = () => {
                videoElement.play();
                let isProcessingFrame = false;
                function processVideoLoop() {
                  if (!isProcessingFrame && videoElement.readyState >= 2) {
                    isProcessingFrame = true;
                    offscreenCtx.drawImage(videoElement, 0, 0, 128, 96);
                    hands.send({ image: offscreenCanvas })
                      .catch(() => {})
                      .finally(() => {
                        isProcessingFrame = false;
                        setTimeout(processVideoLoop, 150);
                      });
                  } else {
                    setTimeout(processVideoLoop, 150);
                  }
                }
                processVideoLoop();
              };
            }).catch((err) => { console.warn("웹캠 접근 실패:", err); });
          }
        }
      } catch (err) {}
    }, 2000);
  </script>
