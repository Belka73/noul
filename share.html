<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>너울 - 당신에게 도착한 나비</title>
  
  <!-- 라이브러리 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard Variable", Pretendard, Roboto, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem 1rem;
    }

    .share-card-container {
      width: 100%;
      max-width: 380px;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .canvas-3d-box {
      width: 100%;
      height: 260px;
      position: relative;
      margin: 0.5rem 0 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading-spinner {
      position: absolute;
      color: #888;
      font-size: 0.8rem;
      pointer-events: none;
    }

    .exhibition-info-table {
      width: 100%;
      border-top: 1.5px solid rgba(255, 255, 255, 0.2);
      margin-top: 1.2rem;
      padding-top: 0.8rem;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 0.45rem 0;
      font-size: 0.82rem;
      line-height: 1.4;
    }

    .info-label {
      color: #8e8e93;
      font-weight: 500;
      flex-shrink: 0;
      width: 75px;
    }

    .info-value {
      color: #f2f2f7;
      font-weight: 600;
      text-align: right;
      word-break: keep-all;
    }
  </style>
</head>
<body>

  <main class="share-card-container">
    <!-- 상단 인트로 문구 -->
    <header class="text-center space-y-1">
      <h1 id="share-title-text" class="text-lg font-black text-white tracking-tight leading-snug">
        빛의 나비가 도착했습니다
      </h1>
    </header>

    <!-- 3D 나비 뷰어 -->
    <div id="share-three-container" class="canvas-3d-box">
      <div id="loading-indicator" class="loading-spinner">나비를 불러오는 중...</div>
    </div>

    <!-- 나비 이야기 카드 -->
    <div class="w-full bg-white/5 border border-white/10 rounded-2xl p-3.5 text-center">
      <p id="share-memo-text" class="text-xs text-neutral-200 leading-relaxed font-light break-keep">
        "너의 찬란한 날갯짓을 응원해."
      </p>
    </div>

    <!-- 전시 안내 정보 -->
    <section class="exhibition-info-table">
      <h2 class="text-xs font-bold text-neutral-300 tracking-wider mb-1 flex items-center gap-1.5">
        <span>📍</span> 전시 및 작품 관람 안내
      </h2>

      <div class="info-row">
        <span class="info-label">전시명</span>
        <span class="info-value">너울 (Noul) 졸업전시</span>
      </div>
      <div class="info-row">
        <span class="info-label">전시 기간</span>
        <span class="info-value">2026. 10. 24 - 10. 27</span>
      </div>
      <div class="info-row">
        <span class="info-label">관람 시간</span>
        <span class="info-value">11:00 ~ 18:00</span>
      </div>
      <div class="info-row">
        <span class="info-label">전시 장소</span>
        <span class="info-value">인천 연수구 송도문화로 120번길 20<br>미카엘관 B1 2관</span>
      </div>
    </section>

    <!-- 지도 및 길찾기 버튼 -->
    <footer class="w-full mt-5 space-y-2">
      <a href="https://map.naver.com/?query=%EC%9D%B8%EC%B2%9C%20%EC%97%B0%EC%88%98%EA%B5%AC%20%EC%86%A1%EB%8F%84%EB%AC%B8%ED%99%94%EB%A1%9C%20120%EB%B2%88%EA%B8%B8%2020" target="_blank" 
         class="w-full py-3.5 rounded-full bg-white text-black font-bold text-xs flex items-center justify-center gap-2 active:scale-95 transition-all shadow-lg shadow-white/10">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
        </svg>
        전시장 위치 및 길찾기
      </a>
      <p class="text-[11px] text-neutral-500 text-center tracking-tight pt-1">
        공간에 직접 방문하여 날아오르는 수많은 나비의 너울을 마주해보세요.
      </p>
    </footer>
  </main>

  <script>
    // 1. Supabase 클라이언트 설정 (변수명을 supabaseClient로 분리하여 전역 충돌 완벽 방지)
    const SUPABASE_URL = 'https://djmdzsbfsobsutphragw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqbWR6c2Jmc29ic3V0cGhyYWd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4ODQ3NTgsImV4cCI6MjEwNTQ2MDc1OH0.BC7llaSjbq6cYhDlRqrwJaycpQ6gSNcp5LgYBeM6WEM';
    let supabaseClient = null;
    try {
      const sbFactory = window.supabase || window.Supabase;
      if (sbFactory && typeof sbFactory.createClient === 'function') {
        supabaseClient = sbFactory.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) {
      console.warn("Supabase 초기화 경고:", e);
    }

    // 2. URL 파라미터 기본값
    const urlParams = new URLSearchParams(window.location.search);
    const butterflyId = urlParams.get('id');
    let butterflyName = urlParams.get('name') || "빛의 나비";
    let memoText = urlParams.get('memo') || "너의 찬란한 날갯짓을 응원해.";
    let shape = urlParams.get('shape') || "crescent";
    let patternId = urlParams.get('pattern') || null;
    let antennaType = urlParams.get('antenna') || "ball";
    let textureUrl = urlParams.get('texture') || null;

    function updateUIElements() {
      const titleEl = document.getElementById('share-title-text');
      if (titleEl) {
        titleEl.innerHTML = `'${butterflyName}'(이)<br>도착했습니다`;
      }
      const memoEl = document.getElementById('share-memo-text');
      if (memoEl) {
        memoEl.innerText = `"${memoText}"`;
      }
    }
    updateUIElements();

    function createFallbackTexture() {
      const c = document.createElement('canvas');
      c.width = 1024; c.height = 1024;
      const ctx = c.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 1024, 1024);
      grad.addColorStop(0, '#fdfbfb');
      grad.addColorStop(1, '#ebedee');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 1024);
      return c.toDataURL('image/png');
    }

    function get3DPatternPath(shapeKey, patId) {
      if (!patId || patId.indexOf('none') > -1) return null;
      const parts = patId.split('_');
      const patNum = parts[parts.length - 1] || "1";

      let shapePrefix = shapeKey || 'crescent';
      if (shapePrefix === 'moon-halo' || shapePrefix === 'moon') shapePrefix = 'moon-halo';
      else if (shapePrefix === 'dawn-ray' || shapePrefix === 'dawn') shapePrefix = 'dawn-ray';
      else if (shapePrefix === 'wave-fin' || shapePrefix === 'wave') shapePrefix = 'wave-fin';

      return './3DButterfly_pattern/' + shapePrefix + '_pattern_3D_' + patNum + '.png';
    }

    function createWingMaterials(texUrl, patPath) {
      const texLoader = new THREE.TextureLoader();
      texLoader.setCrossOrigin('anonymous');

      const photoTex = texLoader.load(texUrl, undefined, undefined, (err) => {
        console.warn("날개 텍스처 로드 실패, 폴백 사용:", err);
      });
      photoTex.flipY = false;
      if (THREE.sRGBEncoding) photoTex.encoding = THREE.sRGBEncoding;

      let patTex = null;
      let hasPat = false;
      if (patPath) {
        patTex = texLoader.load(patPath);
        patTex.flipY = false;
        if (THREE.sRGBEncoding) patTex.encoding = THREE.sRGBEncoding;
        hasPat = true;
      }

      function createCustomWingShader() {
        return new THREE.ShaderMaterial({
          uniforms: {
            photoMap: { value: photoTex },
            patMap: { value: patTex || new THREE.Texture() },
            hasPattern: { value: hasPat ? 1.0 : 0.0 }
          },
          vertexShader: `
            varying vec2 vProjectedUv;
            varying vec2 vModelUv;
            void main() {
              vModelUv = uv;
              float u = (position.x + 2.4) / 4.8;
              float v = (position.y + 2.4) / 4.8;
              vProjectedUv = vec2(clamp(u, 0.0, 1.0), clamp(1.0 - v, 0.0, 1.0));
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform sampler2D photoMap;
            uniform sampler2D patMap;
            uniform float hasPattern;
            varying vec2 vProjectedUv;
            varying vec2 vModelUv;
            void main() {
              vec4 photoCol = texture2D(photoMap, vProjectedUv);
              vec4 finalCol = photoCol;
              if (hasPattern > 0.5) {
                vec4 patCol = texture2D(patMap, vModelUv);
                finalCol.rgb = mix(finalCol.rgb, finalCol.rgb * patCol.rgb, patCol.a * 0.95);
              }
              gl_FragColor = finalCol;
            }
          `,
          side: THREE.DoubleSide
        });
      }

      return { matL: createCustomWingShader(), matR: createCustomWingShader() };
    }

    // 3D 뷰어 셋업
    const container = document.getElementById('share-three-container');
    const loadingIndicator = document.getElementById('loading-indicator');
    const w = container.clientWidth || 340;
    const h = container.clientHeight || 260;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 100);
    camera.position.set(0, 0, 7.2);

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    if (THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    const ambLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(2, 5, 8);
    scene.add(dirLight);

    const group = new THREE.Group();
    group.rotation.x = 0.75;
    group.rotation.y = -0.55;
    group.rotation.z = 0.35;
    scene.add(group);

    let wingL = null, wingR = null;

    function build3DModel(targetShape, targetAnt, curTexUrl, curPatId) {
      while (group.children.length > 0) {
        group.remove(group.children[0]);
      }
      wingL = null;
      wingR = null;

      const pat3DPath = get3DPatternPath(targetShape, curPatId);
      const wingMats = createWingMaterials(curTexUrl || createFallbackTexture(), pat3DPath);
      const whiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.DoubleSide, roughness: 0.3 });
      const targetAntPrefix = 'Antenna_' + (targetAnt || 'ball');

      const gltfLoader = new THREE.GLTFLoader();
      const modelPath = './3DButterfly/' + targetShape + '.glb';

      gltfLoader.load(
        modelPath,
        function(gltf) {
          if (loadingIndicator) loadingIndicator.style.display = 'none';
          const model = gltf.scene;
          model.traverse(function(child) {
            if (child.isMesh) {
              const n = child.name || '';
              if (n.startsWith('Wing_L')) {
                wingL = child;
                child.material = wingMats.matL;
              } else if (n.startsWith('Wing_R')) {
                wingR = child;
                child.material = wingMats.matR;
              } else if (n.startsWith('Body')) {
                child.material = whiteMat;
              } else if (n.startsWith('Antenna_')) {
                child.material = whiteMat;
                // 선택된 안테나 타입만 보이도록 처리
                child.visible = n.startsWith(targetAntPrefix);
              }
            }
          });
          model.scale.set(0.95, 0.95, 0.95);
          model.position.set(0, 0, 0);
          group.add(model);
        },
        undefined,
        function(err) {
          console.error("GLTF 모델 로드 실패:", modelPath, err);
          if (loadingIndicator) {
            loadingIndicator.innerText = "나비 모델을 불러오지 못했습니다.";
          }
        }
      );
    }

    async function loadButterflyData() {
      if (supabaseClient && butterflyId) {
        try {
          const { data, error } = await supabaseClient
            .from('butterflies')
            .select('*')
            .eq('id', butterflyId)
            .single();

          if (!error && data) {
            butterflyName = data.name || butterflyName;
            memoText = data.memo || memoText;
            shape = data.wing_shape || data.shape || shape;
            patternId = data.pattern_id || data.pattern || patternId;
            antennaType = data.antenna_type || data.antenna || antennaType;
            textureUrl = data.texture_url || data.texture || null;
            updateUIElements();
          }
        } catch (err) {
          console.error("Supabase 나비 조회 실패:", err);
        }
      }
      build3DModel(shape, antennaType, textureUrl, patternId);
    }
    loadButterflyData();

    // 렌더링 루프
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const flap = Math.sin(t * 6.5) * 0.45;

      if (wingL && wingR) {
        wingL.rotation.y = flap;
        wingR.rotation.y = -flap;
      }

      group.position.y = Math.sin(t * 2.0) * 0.08;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', function() {
      const rw = container.clientWidth || 340;
      const rh = container.clientHeight || 260;
      camera.aspect = rw / rh;
      camera.updateProjectionMatrix();
      renderer.setSize(rw, rh);
    });
  </script>
</body>
</html>
